<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Domínios do Clérigo · Bestiário de Terralém</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem('ifdb-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap">
<style>
:root {
  --bg:#0a0a0a; --surface:#151515; --raised:#1e1e1e; --elevated:#262626; --float:#2e2e2e;
  --text:#f5f5f5; --muted:#979797; --subtle:#808080; --on-accent:#0a0a0a;
  --border:#2a2a2a; --border-strong:#424242; --control:#707070;
  --accent:#d4a843; --accent-hover:#c49a2c; --line:#d4a843; --line2:#b8891a; --fill:#9c841c;
  --tint: rgba(156,132,28,.04); --tint-h: rgba(156,132,28,.08); --focus:#9c841c;
  --input:#151515; --ph:#979797;
  --sh1: 0 1px 3px rgba(0,0,0,.3);
  --sh2: 0 4px 12px rgba(0,0,0,.4), 0 0 0 1px rgba(212,168,67,.1);
  --sh3: 0 8px 24px rgba(0,0,0,.5), 0 0 20px rgba(212,168,67,.12);
  --gtext: linear-gradient(135deg, #d4a843, #9c841c, #b8891a);
  --gfill: linear-gradient(135deg, #c49a2c, #9c841c);
  --f-display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --f-body: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
  --f-mono: Consolas, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:#faf8f4; --surface:#f5f2ec; --raised:#f0ece4; --elevated:#ebe6dc; --float:#faf8f4;
    --text:#0a0a0a; --muted:#505050; --subtle:#606060; --on-accent:#faf8f4;
    --border:#e1dacc; --border-strong:#d2c8b4; --control:#808080;
    --accent:#7a5a08; --accent-hover:#5c4204; --line:#9c7410; --line2:#7a5a08; --fill:#7a5a08;
    --tint: rgba(156,116,16,.06); --tint-h: rgba(156,116,16,.12); --focus:#7a5a08;
    --input:#faf8f4; --ph:#505050;
    --sh1: 0 1px 2px rgba(59,44,6,.1);
    --sh2: 0 4px 12px rgba(59,44,6,.12), 0 0 0 1px rgba(156,116,16,.14);
    --sh3: 0 8px 24px rgba(59,44,6,.16), 0 0 0 1px rgba(156,116,16,.18);
    --gtext: linear-gradient(135deg, #7a5a08, #5c4204);
    --gfill: linear-gradient(135deg, #7a5a08, #5c4204);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:#faf8f4; --surface:#f5f2ec; --raised:#f0ece4; --elevated:#ebe6dc; --float:#faf8f4;
  --text:#0a0a0a; --muted:#505050; --subtle:#606060; --on-accent:#faf8f4;
  --border:#e1dacc; --border-strong:#d2c8b4; --control:#808080;
  --accent:#7a5a08; --accent-hover:#5c4204; --line:#9c7410; --line2:#7a5a08; --fill:#7a5a08;
  --tint: rgba(156,116,16,.06); --tint-h: rgba(156,116,16,.12); --focus:#7a5a08;
  --input:#faf8f4; --ph:#505050;
  --sh1: 0 1px 2px rgba(59,44,6,.1);
  --sh2: 0 4px 12px rgba(59,44,6,.12), 0 0 0 1px rgba(156,116,16,.14);
  --sh3: 0 8px 24px rgba(59,44,6,.16), 0 0 0 1px rgba(156,116,16,.18);
  --gtext: linear-gradient(135deg, #7a5a08, #5c4204);
  --gfill: linear-gradient(135deg, #7a5a08, #5c4204);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(70% 40% at 50% 0, color-mix(in srgb, var(--line) 6%, transparent), transparent 70%);
  background-attachment: fixed;
  color: var(--text);
  font: 15px/1.65 var(--f-body);
  min-height: 100vh;
}
h1, h2, h3, h4, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.gt { background: var(--gtext); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ── cabeçalho ─────────────────────────────── */
.top {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px clamp(16px, 3vw, 36px);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 18%, transparent);
}
.from { display: flex; align-items: center; gap: 14px; min-width: 0; }
.to-class {
  font: 600 12px/1 var(--f-display); letter-spacing: .08em; color: var(--muted);
  padding: 8px 12px; border: 1px solid var(--border-strong); border-radius: 999px;
  transition: color .15s, border-color .15s; white-space: nowrap;
}
.to-class:hover { color: var(--accent); border-color: var(--line); }
.crumb { display: grid; min-width: 0; }
.crumb small { font: 600 10px/1.3 var(--f-body); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb b { font: 700 15px/1.3 var(--f-display); letter-spacing: .06em; color: var(--text); }
.theme { display: inline-flex; border: 1px solid var(--control); border-radius: 999px; padding: 2px; flex: none; }
.theme button { font-size: 12px; padding: 4px 10px; border-radius: 999px; color: var(--muted); }
.theme button[aria-pressed="true"] { background: var(--gfill); color: var(--on-accent); font-weight: 600; }

/* ── códice ────────────────────────────────── */
.codex {
  max-width: 1280px; margin: 0 auto;
  padding: 28px clamp(16px, 3vw, 36px) 80px;
  display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: start;
}

/* índice: coluna de nomes */
.index { position: sticky; top: 78px; max-height: calc(100vh - 100px); display: flex; flex-direction: column; min-height: 0; }
.registers { display: flex; gap: 22px; padding-bottom: 2px; border-bottom: 1px solid var(--border); }
.registers button {
  font: 700 13px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  padding: 10px 0 12px; position: relative; display: inline-flex; gap: 8px; align-items: baseline;
}
.registers button small { font: 12px/1 var(--f-mono); letter-spacing: 0; color: var(--subtle); }
.registers button[aria-pressed="true"] { color: var(--accent); }
.registers button[aria-pressed="true"]::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -3px; height: 2px;
  background: linear-gradient(90deg, var(--line2), var(--line), transparent);
}
.search { display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; border-bottom: 1px solid var(--border); padding: 4px 0 8px; }
.search:focus-within { border-bottom-color: var(--focus); }
.search svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--text); font: 14px/1.4 var(--f-body); padding: 0; }
.search input::placeholder { color: var(--ph); }
.search kbd { font: 11px/1 var(--f-mono); color: var(--subtle); border: 1px solid var(--border-strong); border-radius: 4px; padding: 2px 5px; }

.ix { overflow-y: auto; min-height: 0; padding: 4px 4px 12px 0; margin-right: -4px; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.ix-group { display: flex; align-items: center; gap: 10px; padding: 18px 0 6px; }
.ix-group b { font: 700 13px/1 var(--f-display); color: var(--accent); letter-spacing: .08em; }
.ix-group i { flex: 1; height: 1px; background: linear-gradient(90deg, color-mix(in srgb, var(--line) 35%, transparent), transparent); }
.ix-group small { font: 11px/1 var(--f-mono); color: var(--subtle); }

.ix-item { display: grid; width: 100%; gap: 1px; padding: 10px 12px; margin: 0 -12px; width: calc(100% + 24px); border-radius: 8px; transition: background .15s; }
.ix-order { grid-template-columns: 48px minmax(0, 1fr); column-gap: 12px; align-items: center; }
.ix-order .ix-name, .ix-order .ix-deity, .ix-order .ix-line { grid-column: 2; }
.ix-art { grid-column: 1; grid-row: 1 / span 3; width: 48px; height: 64px; border-radius: 4px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--line) 40%, transparent); background: var(--surface); }
.ix-art img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.ix-item:hover { background: var(--tint); }
.ix-item[aria-current="true"] { background: var(--tint-h); }
.ix-name { font: 700 17px/1.25 var(--f-display); letter-spacing: .03em; color: var(--text); }
.ix-item[aria-current="true"] .ix-name { color: var(--accent); }
.ix-deity { font: 400 13px/1.3 var(--f-display); color: var(--muted); letter-spacing: .02em; }
.ix-line { font-size: 12px; line-height: 1.5; color: var(--subtle); margin-top: 3px; }
.ix-line mark { background: none; color: var(--accent); font-weight: 600; }
.ix-dom .ix-name { font-size: 15px; }
.ix-empty { font-size: 13px; color: var(--muted); padding: 16px 0; }
.ix-foot { font-size: 12px; color: var(--subtle); padding-top: 10px; border-top: 1px solid var(--border); }

/* folha */
.folio {
  background: linear-gradient(180deg, var(--raised), var(--surface) 240px);
  border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--sh2);
  padding: clamp(24px, 5vw, 64px) clamp(20px, 5vw, 72px) clamp(32px, 5vw, 72px);
  min-height: 70vh;
}
.leaf { max-width: 720px; margin: 0 auto; display: grid; gap: 40px; animation: turn .25s ease-out; }
@keyframes turn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.back { justify-self: start; display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: -16px; }
.back:hover { color: var(--accent); }

.plate { width: min(240px, 72%); aspect-ratio: 3 / 4; border-radius: 4px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--line) 45%, transparent); background: var(--surface); box-shadow: var(--sh1); }
.plate img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.head { text-align: center; display: grid; justify-items: center; gap: 6px; }
.kicker { font: 600 11px/1.3 var(--f-body); letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
.head h2 { font: 700 clamp(2.2rem, 5vw, 3.6rem)/1.05 var(--f-display); letter-spacing: .05em; text-wrap: balance; }
.head .deity { font: 400 18px/1.3 var(--f-display); color: var(--muted); letter-spacing: .04em; }
.head .deity b { color: var(--text); font-weight: 600; }
.filete { position: relative; width: min(320px, 70%); height: 1px; margin-top: 14px; background: linear-gradient(90deg, transparent, var(--line2) 25%, var(--line) 50%, var(--line2) 75%, transparent); }
.filete span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 0 10px; background: var(--raised); color: var(--line); font-size: 11px; line-height: 1; }

.prose { display: grid; gap: 12px; font-size: 16px; line-height: 1.75; }
.prose.drop > p:first-child::first-letter { font: 700 3.1em/.85 var(--f-display); color: var(--accent); float: left; margin: 6px 10px 0 0; }

.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.fact { display: grid; gap: 6px; align-content: start; border-top: 1px solid var(--border-strong); padding-top: 12px; }
.fact dt { font: 600 10px/1.3 var(--f-body); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.fact .fh { font: 700 17px/1.3 var(--f-display); letter-spacing: .02em; color: var(--accent); }
.fact .fh::first-letter { text-transform: uppercase; }
.fact .ff { font-size: 13px; line-height: 1.55; color: var(--muted); white-space: pre-line; }

.rubric { font-size: 14px; color: var(--muted); display: grid; gap: 10px; margin-top: -16px; }
.rubric summary { cursor: pointer; font: 600 12px/1.4 var(--f-body); letter-spacing: .06em; color: var(--text); list-style: none; display: inline-flex; gap: 8px; }
.rubric summary::-webkit-details-marker { display: none; }
.rubric summary::before { content: '+'; font-family: var(--f-mono); color: var(--accent); }
.rubric[open] summary::before { content: '−'; }
.rubric[open] summary { margin-bottom: 10px; }
.rubric div { display: grid; gap: 10px; }

.sect { display: grid; gap: 16px; }
.sect > h3 {
  font: 700 14px/1.3 var(--f-display); letter-spacing: .16em; text-transform: uppercase; color: var(--accent);
  display: flex; align-items: center; gap: 14px;
}
.sect > h3::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, color-mix(in srgb, var(--line) 35%, transparent), transparent); }
.sect > .lede { font-size: 14px; color: var(--muted); margin-top: -6px; }

.doms { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.doms button {
  font: 700 19px/1.4 var(--f-display); letter-spacing: .03em; color: var(--text);
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px;
  text-decoration-color: color-mix(in srgb, var(--line) 45%, transparent);
  transition: color .15s, text-decoration-color .15s;
}
.doms button:hover { color: var(--accent); text-decoration-color: var(--line); }
.note8 { font-size: 13px; color: var(--muted); }
.note8 b { font-family: var(--f-mono); color: var(--accent); font-weight: 700; margin-right: 4px; }

.ladder { display: grid; }
.step { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 20px; position: relative; padding-bottom: 28px; }
.step:not(:last-child)::before { content: ''; position: absolute; left: 23.5px; top: 54px; bottom: 6px; width: 1px; background: color-mix(in srgb, var(--line) 22%, transparent); }
.seal {
  width: 48px; height: 48px; border-radius: 999px; display: grid; place-content: center; text-align: center;
  background: linear-gradient(180deg, var(--elevated), var(--raised));
  border: 1px solid color-mix(in srgb, var(--line) 45%, transparent);
}
.seal b { font: 700 19px/1 var(--f-display); color: var(--accent); }
.seal small { font: 600 9px/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.seal.none { border-style: dashed; border-color: var(--border-strong); background: transparent; }
.seal.none b { color: var(--muted); font-weight: 400; }
.step-body { display: grid; gap: 10px; padding-top: 10px; min-width: 0; }
.step-body h4 { font: 700 19px/1.3 var(--f-display); letter-spacing: .03em; }
.step-body p { font-size: 15px; line-height: 1.7; color: var(--text); }
.step-body p.dim { color: var(--muted); }
.step-body b.lbl { font-weight: 600; color: var(--accent); }
.step-body h5 { margin: 6px 0 0; font: 700 12px/1.3 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.step-body ul { display: grid; gap: 4px; padding-left: 2px; }
.step-body ul li { display: grid; grid-template-columns: 14px 1fr; font-size: 15px; line-height: 1.6; }
.step-body ul li::before { content: '–'; color: var(--line2); }

.elist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.elist section { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
.elist h6 { margin: 0 0 6px; font: 700 13px/1.3 var(--f-display); color: var(--accent); letter-spacing: .06em; }
.elist li { display: grid; grid-template-columns: 46px 1fr; font-size: 13px; line-height: 1.6; }
.elist li span:first-child { font: 11px/1.9 var(--f-mono); color: var(--muted); }

.tbl { overflow-x: auto; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 380px; }
.tbl caption { text-align: left; font: 700 12px/1.3 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding-bottom: 8px; }
.tbl th { font: 600 10px/1.2 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border-strong); }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--border); }
.tbl td:first-child { font-family: var(--f-display); font-weight: 700; color: var(--accent); }

.spl { display: grid; }
.spl li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 16px; align-items: center; padding: 10px 0; border-top: 1px dashed var(--border-strong); }
.spl li:first-child { border-top: 0; }
.spl .c {
  width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center;
  border: 1px solid color-mix(in srgb, var(--line) 45%, transparent);
  font: 700 12px/1 var(--f-display); color: var(--accent);
}
.spl .n { font: 400 17px/1.3 var(--f-display); letter-spacing: .02em; }
.spl .n small { font: 12px/1 var(--f-body); color: var(--muted); letter-spacing: 0; margin-left: 6px; }

.givers { display: flex; flex-wrap: wrap; gap: 10px; }
.givers button {
  display: grid; gap: 1px; padding: 10px 14px; border-radius: 8px; min-width: 150px;
  border: 1px solid var(--border-strong); background: var(--surface);
  transition: border-color .15s, background .15s;
}
.givers button:hover { border-color: var(--line); background: var(--tint-h); }
.givers b { font: 700 15px/1.3 var(--f-display); letter-spacing: .03em; }
.givers small { font: 400 12px/1.3 var(--f-display); color: var(--muted); }
.givers button[aria-current="true"] { border-color: var(--line2); }
.none-text { font-size: 14px; color: var(--muted); }

.cover { text-align: center; display: grid; gap: 18px; justify-items: center; padding-top: 6vh; }
.cover p { color: var(--muted); max-width: 52ch; }
.cover .counts { display: flex; gap: 40px; justify-content: center; }
.cover .counts div { display: grid; }
.cover .counts b { font: 700 34px/1 var(--f-display); color: var(--accent); }
.cover .counts small { font: 600 10px/1.6 var(--f-body); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

/* ── estreito: uma coisa por vez ───────────── */
@media (max-width: 749px) {
  .codex { grid-template-columns: 1fr; padding-top: 16px; }
  .index { position: static; max-height: none; }
  .ix { overflow: visible; }
  .codex[data-view="order"] .index, .codex[data-view="domain"] .index { display: none; }
  .codex[data-view="index"] .folio { display: none; }
  .folio { padding: 24px 18px 40px; border-radius: 10px; }
  .leaf { gap: 32px; }
  .facts { grid-template-columns: 1fr; gap: 16px; }
  .step { grid-template-columns: 40px minmax(0, 1fr); gap: 14px; }
  .seal { width: 40px; height: 40px; }
  .seal b { font-size: 16px; }
  .step:not(:last-child)::before { left: 19.5px; top: 46px; }
  .crumb small { display: none; }
  .theme button { padding: 4px 8px; }
  .to-class { padding: 7px 10px; }
  .search kbd { display: none; }
}
@media (min-width: 750px) { .back.m-only { display: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>

<header class="top">
  <div class="from">
    <button type="button" class="to-class" title="Volta à roda de seções do Clérigo">← Clérigo</button>
    <div class="crumb">
      <small>Roda do Clérigo · nó Domínios</small>
      <b>Ordens e Domínios</b>
    </div>
  </div>
  <div class="theme" role="group" aria-label="Tema">
    <button type="button" data-theme-opt="system">Sistema</button>
    <button type="button" data-theme-opt="light">Claro</button>
    <button type="button" data-theme-opt="dark">Escuro</button>
  </div>
</header>

<main class="codex" id="codex" data-view="index">
  <nav class="index" aria-label="Índice">
    <div class="registers" role="group" aria-label="Entradas do códice">
      <button type="button" data-reg="ordens">Ordens <small id="nOrd"></small></button>
      <button type="button" data-reg="dominios">Domínios <small id="nDom"></small></button>
    </div>
    <label class="search">
      <span class="sr-only">Buscar</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Ordem, deus, domínio ou magia" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="ix" id="ix"></div>
  </nav>
  <section class="folio" id="folio" aria-live="polite"></section>
</main>

<script>

ao Gelo", "lv": 6, "x": "No 6º nível, você ganha resistência a gelo 10. Essa resistência aumenta para 20 no 12º nível. No 20º nível, você se torna imune a gelo."}], "spells": [{"c": 1, "n": "Adaga de Gelo"}, {"c": 2, "n": "Queda Congelante"}, {"c": 3, "n": "Lanças de Gelo"}, {"c": 4, "n": "Tempestade de Gelo"}, {"c": 5, "n": "Blizzaga"}, {"c": 6, "n": "Explosão Gélida"}]}, {"id": "conhecimento", "name": "Conhecimento", "title": "Domínio do Conhecimento", "flavor": "Você é um estudioso e sábio das lendas. Além disso, todas as perícias de Conhecimento são tratadas como perícias de classe.", "powers": [{"n": "Guardião do Saber", "lv": null, "x": "Você pode tocar uma criatura para aprender sobre suas habilidades e fraquezas. Com um ataque de toque bem-sucedido, você obtém informações como se tivesse realizado o teste apropriado de Conhecimento"}, {"n": "Visão Remota", "lv": 6, "x": "A partir do 6º nível, você pode usar clarividência à vontade como uma habilidade similar à magia, utilizando seu nível de clérigo como nível de conjurador. Você pode usar esta habilidade por um número de rodadas por dia igual ao seu nível de clérigo. Essas rodadas não precisam ser consecutivas."}], "spells": [{"c": 1, "n": "Compreender Idiomas"}, {"c": 2, "n": "Augúrio"}, {"c": 3, "n": "Escrutinar"}, {"c": 4, "n": "Adivinhação"}, {"c": 5, "n": "Línguas Comunitárias"}, {"c": 6, "n": "Visão Verdadeira"}]}, {"id": "lei", "name": "Lei", "title": "Domínio da Lei", "flavor": "Você segue um código rígido e ordenado de leis e, ao fazê-lo, alcança a iluminação.", "powers": [{"n": "Toque da Lei", "lv": null, "x": "Você pode tocar uma criatura voluntária como uma ação padrão, infundindo-a com o poder da ordem divina e permitindo que, por 1 rodada, ela trate todas as jogadas de ataque, testes de perícia, testes de atributo e testes de resistência como se o resultado natural do d20 fosse 11. Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}, {"n": "Bastão da Ordem", "lv": 8, "x": "No 8º nível, você pode conceder a uma arma tocada a propriedade especial axiomática por um número de rodadas igual à metade do seu nível de clérigo. Você pode usar esta habilidade uma vez por dia no 8º nível, e ganha um uso adicional por dia a cada quatro níveis acima do 8º."}], "spells": [{"c": 1, "n": "Abençoar Arma"}, {"c": 2, "n": "Litania da Defesa"}, {"c": 3, "n": "Litania da Visão"}, {"c": 4, "n": "Litania da Vingança"}, {"c": 5, "n": "Protectra II"}, {"c": 6, "n": "Conhecimento das Lendas"}]}, {"id": "libertacao", "name": "Libertação", "title": "Domínio da Libertação", "flavor": "Você é um espírito de liberdade e um inimigo ferrenho de todos que buscam escravizar e oprimir.", "powers": [{"n": "Libertação", "lv": null, "x": "Você possui a habilidade de ignorar impedimentos à sua mobilidade. Por um número de rodadas por dia igual ao seu nível de clérigo, você pode se mover normalmente independentemente de efeitos mágicos que impeçam movimento, como se estivesse sob o efeito de liberdade de movimento. Este efeito ocorre automaticamente assim que se aplica. As rodadas não precisam ser consecutivas."}, {"n": "Chamado da Liberdade", "lv": 8, "x": "No 8º nível, você pode emitir uma aura de liberdade com alcance de 9 metros por um número de rodadas por dia igual ao seu nível de clérigo. Aliados dentro dessa aura não são afetados pelas condições confuso, debilitado, amedrontado, agarrado, imobilizado, apavorado, paralisado, imobilizado por contenção, ou abalado. Esta aura apenas suprime esses efeitos; eles retornam quando a criatura deixa a área da aura ou quando a aura termina, se aplicável. Essas rodadas não precisam ser consecutivas."}], "spells": [{"c": 1, "n": "Fearna"}, {"c": 2, "n": "Paralyna"}, {"c": 3, "n": "Cruz"}, {"c": 4, "n": "Liberdade de Movimento"}, {"c": 5, "n": "Dobrar Espaço e Tempo"}, {"c": 6, "n": "Dissipar Magia Maior"}]}, {"id": "relampago", "name": "Relâmpago", "title": "Domínio do Relâmpago", "flavor": "Você pode manipular relâmpagos e é resistente a dano elétrico.", "powers": [{"n": "Arco Elétrico", "lv": null, "x": "Como uma ação padrão, você pode liberar um arco de relâmpagos contra qualquer inimigo a até 9 metros, realizando um ataque de toque à distância. O arco elétrico causa 1d6 pontos de dano elétrico + 1 ponto para cada dois níveis de clérigo que você possui. Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}, {"n": "Resistência a Eletricidade", "lv": 6, "x": "No 6º nível, você ganha resistência a eletricidade 10. Essa resistência aumenta para 20 no 12º nível. No 20º nível, você se torna imune a eletricidade."}], "spells": [{"c": 1, "n": "Toque Chocante"}, {"c": 2, "n": "Choque Defensivo"}, {"c": 3, "n": "Raio Elétrico"}, {"c": 4, "n": "Trovão IV"}, {"c": 5, "n": "Arco Elétrico"}, {"c": 6, "n": "Relâmpago em Cadeia"}]}, {"id": "sorte", "name": "Sorte", "title": "Domínio da Sorte", "flavor": "Você é imbuído de sorte, e sua mera presença espalha boa fortuna.", "powers": [{"n": "Golpe de Sorte", "lv": null, "x": "Você pode tocar uma criatura voluntária como uma ação padrão, concedendo-lhe um toque de sorte. Na rodada seguinte, sempre que o alvo rolar um d20, ele pode rolar duas vezes e escolher o melhor resultado. Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}, {"n": "Boa Fortuna", "lv": 6, "x": "A partir do 6º nível, como uma reação, você pode rerrolar um d20 que acabou de rolar. Você deve aceitar o resultado da nova rolagem, mesmo que seja pior. Você pode usar esta habilidade uma vez por dia no 6º nível, e ganha um uso adicional por dia a cada seis níveis de clérigo acima do 6º."}], "spells": [{"c": 1, "n": "Golpe Verdadeiro"}, {"c": 2, "n": "Auxílio"}, {"c": 3, "n": "Protectra"}, {"c": 4, "n": "Liberdade de Movimento"}, {"c": 5, "n": "Grande Destino"}, {"c": 6, "n": "Enganar"}]}, {"id": "loucura", "name": "Loucura", "title": "Domínio da Loucura", "flavor": "Você abraça a loucura que se esconde nas profundezas do seu coração, podendo libertá-la para enlouquecer seus inimigos ou sacrificar certas capacidades para aprimorar outras.", "powers": [{"n": "Visão da Loucura", "lv": null, "x": "Você pode conceder a uma criatura uma visão de loucura com um ataque de toque corpo a corpo. Escolha um dos seguintes: jogadas de ataque, testes de resistência ou testes de perícia. O alvo recebe um bônus no tipo escolhido igual à metade do seu nível de clérigo (mínimo +1) e uma penalidade nos outros dois tipos igual à metade do seu nível de clérigo (mínimo –1). Este efeito se dissipa após 3 rodadas. Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}, {"n": "Aura da Loucura", "lv": 8, "x": "No 8º nível, você pode emitir uma aura de loucura com alcance de 9 metros por um número de rodadas por dia igual ao seu nível de clérigo. Inimigos dentro dessa aura são afetados por confusão, a menos que passem em um teste de Constituição com. O efeito de confusão termina imediatamente quando a criatura deixa a área ou quando a aura se encerra. Criaturas que forem bem-sucedidas no teste de resistência ficam imunes a esta aura por 24 horas. Essas rodadas não precisam ser consecutivas."}], "spells": [{"c": 1, "n": "Ilusão de Calma"}, {"c": 2, "n": "Alucinação Insana"}, {"c": 3, "n": "Visão do Inferno"}, {"c": 4, "n": "Parede Ilusória"}, {"c": 5, "n": "Grande Destino"}, {"c": 6, "n": "Onda do Crime"}]}, {"id": "magia", "name": "Magia", "title": "Domínio da Magia", "flavor": "Você é um verdadeiro estudante de todas as coisas místicas e enxerga a divindade na pureza da magia.", "powers": [{"n": "Mão do Acólito", "lv": null, "x": "Você pode fazer sua arma corpo a corpo voar de suas mãos e atingir um inimigo antes de retornar instantaneamente. Como uma ação padrão, você pode realizar um único ataque com uma arma corpo a corpo a uma distância de até 9 metros. Esse ataque é tratado como um ataque à distância com arma arremessada, exceto que você adiciona seu modificador de Carisma à jogada de ataque em vez do modificador de Destreza (o dano ainda depende de Força). Esta habilidade não pode ser usada para realizar uma manobra de combate. Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}, {"n": "Toque Dissipador", "lv": 8, "x": "No 8º nível, você pode usar um efeito de dissipar magia direcionado como um ataque de toque corpo a corpo. Você pode usar esta habilidade uma vez por dia no 8º nível e uma vez adicional por dia a cada quatro níveis de clérigo além do 8º."}], "spells": [{"c": 1, "n": "Identificar"}, {"c": 2, "n": "Boca Mágica"}, {"c": 3, "n": "Dissipar Magia"}, {"c": 4, "n": "Olho Estelar"}, {"c": 5, "n": "Telecinese"}, {"c": 6, "n": "Campo Antimagia"}]}, {"id": "nobreza", "name": "Nobreza", "title": "Domínio da Nobreza", "flavor": "Você é um grande líder, uma inspiração para todos que seguem os ensinamentos de sua fé.", "powers": [{"n": "Palavra Inspiradora", "lv": null, "x": "Como uma ação padrão, você pode pronunciar uma palavra inspiradora para uma criatura a até 9 metros. Essa criatura recebe um bônus de moral de +2 em jogadas de ataque, testes de perícia, testes de habilidade e testes de resistência por um número de rodadas igual à metade do seu nível de clérigo (mínimo 1). Você pode usar este poder um número de vezes por dia igual a 3 + seu modificador de Carisma."}, {"n": "Liderança", "lv": 8, "x": "No 8º nível, você recebe Liderança como um talento bônus. Além disso, você ganha um bônus de +2 em sua pontuação de Liderança enquanto mantiver os dogmas de sua divindade."}], "spells": [{"c": 1, "n": "Momento Habilidoso"}, {"c": 2, "n": "Momento de Grandeza"}, {"c": 3, "n": "Vestimenta Mágica"}, {"c": 4, "n": "Aura do Despercebido"}, {"c": 5, "n": "Grande Destino"}, {"c": 6, "n": "Geas/Missão"}]}, {"id": "plantas", "name": "Plantas", "title": "Domínio das Plantas", "flavor": "Você encontra conforto no verde, pode fazer crescer espinhos defensivos e se comunicar com plantas.", "powers": [{"n": "Punho de Madeira", "lv": null, "x": "Como uma ação livre, suas mãos podem se tornar tão duras quanto madeira, cobertas por pequenos espinhos. Enquanto estiver com os punhos de madeira, seus ataques desarmados não provocam ataques de oportunidade, causam dano letal e recebem um bônus nas jogadas de dano igual à metade do seu nível de clérigo (mínimo +1). Você pode usar esta habilidade por um número de rodadas por dia igual a 3 + seu modificador de Carisma. Essas rodadas não precisam ser consecutivas."}, {"n": "Armadura de Espinhos", "lv": 6, "x": "No 6º nível, você pode fazer com que uma série de espinhos de madeira irrompa de sua pele como uma ação livre. Enquanto a armadura de espinhos estiver ativa, qualquer inimigo que o atinja com um ataque desarmado ou com uma arma corpo a corpo sem alcance sofre 1d6 pontos de dano perfurante + 1 ponto para cada dois níveis de clérigo que você possua. Você pode usar esta habilidade por um número de rodadas por dia igual ao seu nível de clérigo. Essas rodadas não precisam ser consecutivas."}], "spells": [{"c": 1, "n": "Enredar"}, {"c": 2, "n": "Pele de Árvore"}, {"c": 3, "n": "Crescimento Vegetal"}, {"c": 4, "n": "Folha IV"}, {"c": 5, "n": "Muralha de Espinhos"}, {"c": 6, "n": "Repelir Madeira"}]}, {"id": "protecao", "name": "Proteção", "title": "Domínio da Proteção", "flavor": "Sua fé é sua maior fonte de proteção, e você pode usá-la para defender outros. Além disso, você recebe um bônus de resistência de +1 em testes de resistência. Esse bônus aumenta em +1 a cada 5 níveis de clérigo que você possuir.", "powers": [{"n": "Toque Resistente", "lv": null, "x": "Como uma ação padrão, você pode tocar um aliado para conceder a ele seu bônus de resistência por 1 minuto. Ao usar esta habilidade, você perde o bônus de resistência concedido pelo Domínio da Proteção por 1 minuto. Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}, {"n": "Aura de Proteção", "lv": 8, "x": "No 8º nível, você pode emitir uma aura de proteção de 9 metros por um número de rodadas por dia igual ao seu nível de clérigo. Você e seus aliados dentro dessa aura recebem um bônus de deflexão de +1 na CA e resistência 5 contra todos os elementos (terra, fogo, gelo, relâmpago, água e vento). O bônus de deflexão aumenta em +1 para cada quatro níveis de clérigo além do 8º. No 14º nível, a resistência contra todos os elementos aumenta para 10. Essas rodadas não precisam ser consecutivas."}], "spells": [{"c": 1, "n": "Proteger"}, {"c": 2, "n": "Barrar Elemento"}, {"c": 3, "n": "Protectra"}, {"c": 4, "n": "Proteção contra Elementos"}, {"c": 5, "n": "Protect III"}, {"c": 6, "n": "Nulstatusra"}]}, {"id": "repouso", "name": "Repouso", "title": "Domínio do Repouso", "flavor": "Você não vê a morte como algo a ser temido, mas como um descanso final e a recompensa por uma vida bem vivida. A mancha da não-morte é uma afronta àquilo que você considera sagrado.", "powers": [{"n": "Descanso Suave", "lv": null, "x": "Seu toque pode preencher uma criatura com letargia. Como um ataque de corpo a corpo, você pode fazer uma criatura viva ficar cambaleante por 1 rodada. Se você tocar uma criatura viva que já esteja cambaleante, ela adormece por 1 rodada. Criaturas mortas-vivas tocadas ficam cambaleantes por um número de rodadas igual ao seu modificador de Carisma. Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}, {"n": "Proteção Contra a Morte", "lv": 8, "x": "No 8º nível, você pode emitir uma aura de 9 metros que protege contra a morte por um número de rodadas por dia igual ao seu nível de clérigo. Criaturas vivas dentro dessa área são imunes a todos os efeitos de morte, drenagem de energia e efeitos que causem níveis negativos. Esta proteção não remove níveis negativos que a criatura já tenha adquirido, mas esses níveis negativos não têm efeito enquanto a criatura permanecer dentro da área protegida. Essas rodadas não precisam ser consecutivas."}], "spells": [{"c": 1, "n": "Detectar Mortos-Vivos"}, {"c": 2, "n": "Repouso Gentil"}, {"c": 3, "n": "Deter Mortos-Vivos"}, {"c": 4, "n": "Proteção Contra a Morte"}, {"c": 5, "n": "Negar a Morte"}, {"c": 6, "n": "Da Não-Morte à Morte"}]}, {"id": "ruinas", "name": "Ruínas", "title": "Domínio das Ruínas", "flavor": "Você percebe a lenta reconquista da natureza sobre aquilo que um dia pertenceu ao mundo civilizado e entende como garantir que ruínas que detêm poder ou significado continuem a existir.", "powers": [{"n": "Toque da Ruína", "lv": null, "x": "Você pode fortalecer ou enfraquecer objetos com seu toque. Com um ataque de corpo a corpo, você pode aumentar ou reduzir a dureza de um objeto (até um cubo de 3 metros) ou construto em um valor igual à metade do seu nível de clérigo (mínimo 1) por 1 minuto. Você não pode reduzir a dureza de um objeto abaixo de 0, e o mesmo alvo não pode ser afetado por esta habilidade mais de uma vez. Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}, {"n": "Rememoração", "lv": 4, "x": "No 4º nível, quando estiver dentro de uma ruína ou outra estrutura que não seja mais reivindicada pela civilização, você pode invocar a sabedoria da terra e de seus antigos habitantes já mortos. Uma vez por dia a cada 4 níveis de clérigo que você possua, você pode conjurar adivinhação como uma habilidade similar a magia."}, {"n": "Passos Firmes", "lv": 8, "x": "No 8º nível, seu deslocamento não é reduzido por terreno difícil, a menos que o terreno tenha sido magicamente manipulado para impedir o movimento."}], "spells": [{"c": 1, "n": "Passos Longos"}, {"c": 2, "n": "Chamado da Pedra"}, {"c": 3, "n": "Fundir-se à Pedra"}, {"c": 4, "n": "Deslocamento Terrestre"}, {"c": 5, "n": "Passagem pela Parede"}, {"c": 6, "n": "Vincular a Terra em Massa"}]}, {"id": "runas", "name": "Runas", "title": "Domínio das Runas", "flavor": "Em runas estranhas e arcanas você encontra magia poderosa. Você recebe Escrever Pergaminho como um talento bônus.", "powers": [{"n": "Runa Explosiva", "lv": null, "x": "Como uma ação padrão, você pode criar uma runa explosiva em qualquer quadrado adjacente. Qualquer criatura que entrar nesse quadrado sofre 1d6 pontos de dano + 1 ponto para cada dois níveis de clérigo que você possua. Esta runa causa dano de terra, fogo, gelo, relâmpago, água ou vento, escolhido no momento da criação. A runa é invisível e dura um número de rodadas igual ao seu nível de clérigo ou até ser ativada. Você não pode criar uma runa explosiva em um quadrado ocupado por outra criatura. Esta runa conta como uma magia de 1º nível para fins de dissipação. Ela pode ser descoberta com um teste de Percepção CD 16 e desarmada com um teste de Ofício (Desarmar Dispositivos) CD 16. Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}, {"n": "Runa de Magia", "lv": 8, "x": "No 8º nível, você pode vincular outra magia que conjurar a uma de suas runas explosivas, fazendo com que essa magia afete a criatura que ativar a runa, além do dano. Essa magia deve ser de pelo menos um nível abaixo da magia de clérigo de maior nível que você possa conjurar e deve ter como alvo uma ou mais criaturas. Independentemente do número de alvos que a magia normalmente poderia afetar, ela afeta apenas a criatura que ativar a runa."}], "spells": [{"c": 1, "n": "Escudo"}, {"c": 2, "n": "Símbolo de Espelhamento"}, {"c": 3, "n": "Retroceder a Chave"}, {"c": 4, "n": "Símbolo de Lentidão"}, {"c": 5, "n": "Evitar"}, {"c": 6, "n": "24 Horas"}]}, {"id": "escamados", "name": "Escamados", "title": "Domínio dos Escamados", "flavor": "Você possui uma conexão inata com serpentes e seus semelhantes.", "powers": [{"n": "Olhar Venenoso", "lv": null, "x": "Você é um verdadeiro senhor dos répteis, capaz de induzir dor, pânico e confusão com um simples olhar, e seus olhos hipnotizantes podem até levar criaturas fracas à inconsciência. Como uma ação padrão, você pode ativar um ataque de olhar com alcance de 9 metros. Este é um ataque de olhar ativo que pode ter como alvo uma única criatura dentro do alcance. O alvo deve realizar um teste de Constituição. Aqueles que falharem sofrem 1d6 pontos de dano não letal + 1 ponto para cada dois níveis de clérigo que você possua e ficam fascinados até o início do seu próximo turno. Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma. Este é um efeito que afeta a mente."}, {"n": "Sopro de Dragão", "lv": 4, "x": "A partir do 4º nível, você pode usar uma arma de sopro uma vez por dia como uma ação padrão. Ao adquirir esta habilidade, escolha entre terra, fogo, gelo, relâmpago, água ou vento — isso determina o tipo de dano causado pelo seu sopro. Uma vez feita essa escolha, ela não pode ser alterada posteriormente. Sua arma de sopro preenche um cone de 4 metros e causa 3d6 pontos de dano, aumentando em +1d6 a cada 2 níveis após o 4º. Uma criatura atingida pelo seu sopro pode tentar um teste de Destreza para sofrer apenas metade do dano. No 9º nível, você pode usar esta habilidade duas vezes por dia, e no 14º nível, três vezes por dia."}], "spells": [{"c": 1, "n": "Presas Mágicas"}, {"c": 2, "n": "Transe Animal"}, {"c": 3, "n": "Presas Mágicas Aprimoradas"}, {"c": 4, "n": "Mandíbula Poderosa"}, {"c": 5, "n": "Crescimento Animal"}, {"c": 6, "n": "Forma Bestial IV (apenas répteis)"}]}, {"id": "sombras", "name": "Sombras", "title": "Domínio das Sombras", "flavor": "Você pode manipular a escuridão e as sombras, e é resistente a dano de sombra.", "powers": [{"n": "Explosão Sombria", "lv": null, "x": "Como uma ação padrão, você pode liberar uma explosão de sombras contra qualquer inimigo a até 9 metros como um ataque de toque à distância. Esta explosão causa 1d6 pontos de dano de sombra + 1 ponto para cada dois níveis de clérigo que você possua. Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}, {"n": "Resistência à Sombra", "lv": 6, "x": "No 6º nível, você recebe resistência à sombra 10. Esta resistência aumenta para 20 no 12º nível. No 20º nível, você adquire imunidade à sombra."}], "spells": [{"c": 1, "n": "Arma Sombria"}, {"c": 2, "n": "Âncora Sombria"}, {"c": 3, "n": "Elemental Sombrio Menor"}, {"c": 4, "n": "Passo Sombrio"}, {"c": 5, "n": "Cura Sombria"}, {"c": 6, "n": "Caminhar pelas Sombras"}]}, {"id": "forca", "name": "Força", "title": "Domínio da Força", "flavor": "Na força e no vigor existe a verdade — sua fé lhe concede poder e força extraordinários.", "powers": [{"n": "Surto de Força", "lv": null, "x": "Como uma ação padrão, você pode tocar uma criatura para conceder-lhe grande força. Por 1 rodada, o alvo recebe um bônus de aprimoramento igual à metade do seu nível de clérigo (mínimo +1) em ataques corpo a corpo, testes de manobra de combate que dependam de Força, perícias baseadas em Força e testes de Força. Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}, {"n": "Poder dos Deuses", "lv": 8, "x": "No 8º nível, você pode adicionar seu nível de clérigo como um bônus de aprimoramento ao seu valor de Força por um número de rodadas por dia igual ao seu nível de clérigo. Este bônus se aplica apenas a testes de Força e perícias baseadas em Força. Essas rodadas não precisam ser consecutivas."}], "spells": [{"c": 1, "n": "Aumentar Pessoa"}, {"c": 2, "n": "Poder"}, {"c": 3, "n": "Vestimenta Mágica"}, {"c": 4, "n": "Força de Orc"}, {"c": 5, "n": "Aumentar Pessoa Aprimorado"}, {"c": 6, "n": "Berserk"}]}, {"id": "sol", "name": "Sol", "title": "Domínio do Sol", "flavor": "Você enxerga a verdade na luz pura e ardente do sol, podendo invocar sua bênção ou sua fúria para realizar grandes feitos.", "powers": [{"n": "Bênção do Sol", "lv": null, "x": "Sempre que você canalizar energia positiva para ferir mortos-vivos, adicione seu nível de clérigo ao dano causado. Mortos-vivos não adicionam sua resistência à canalização aos testes de resistência quando você canaliza energia positiva."}, {"n": "Nimbus de Luz", "lv": 8, "x": "No 8º nível, você pode emitir um nimbus de luz com alcance de 9 metros por um número de rodadas por dia igual ao seu nível de clérigo. Isto funciona como a magia luz do dia. Além disso, mortos-vivos dentro desse raio sofrem uma quantidade de dano igual ao seu nível de clérigo a cada rodada em que permanecerem dentro do nimbus. Magias e habilidades similares a magia com o descritor escuridão são automaticamente dissipadas se entrarem neste nimbus. Essas rodadas não precisam ser consecutivas."}], "spells": [{"c": 1, "n": "Metal Solar"}, {"c": 2, "n": "Suportar Elementos em Grupo"}, {"c": 3, "n": "Luz Abrasadora"}, {"c": 4, "n": "Espinhos Radiantes"}, {"c": 5, "n": "Muralha de Fogo"}, {"c": 6, "n": "Golpe Flamejante"}]}, {"id": "tempo", "name": "Tempo", "title": "Domínio do Tempo", "flavor": "Você busca controlar a natureza temporal do tempo.", "powers": [{"n": "Refazer", "lv": null, "x": "Como uma ação reação, você pode refazer uma rolagem falha de teste de perícia, teste de resistência ou jogada de ataque. Você deve aceitar o segundo resultado, independentemente do valor. Você pode usar esta habilidade uma vez por dia, e mais uma vez adicional por dia a cada quatro níveis de clérigo além do 1º."}, {"n": "Insight Temporal", "lv": 8, "x": "No 8º nível, como uma reação, você pode emitir uma aura temporal de 9 metros que concede a você e a todos os aliados dentro da área um bônus na iniciativa igual à metade do seu nível de clérigo (mínimo 1). Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}], "spells": [{"c": 1, "n": "Presságio de Perigo"}, {"c": 2, "n": "Tremor Temporal"}, {"c": 3, "n": "Abrigo Fora do Tempo"}, {"c": 4, "n": "Hora de Agir"}, {"c": 5, "n": "Reparo Temporal"}, {"c": 6, "n": "Hora de Pausar"}]}, {"id": "viagem", "name": "Viagem", "title": "Domínio da Viagem", "flavor": "Você é um explorador e encontra iluminação na simples alegria de viajar, seja a pé, por meio de montarias, veículos ou magia. Aumente seu deslocamento base em 3 metros.", "powers": [{"n": "Pés Ágeis", "lv": null, "x": "Como uma ação livre, você pode ganhar mobilidade aumentada por 1 rodada. Na próxima rodada, você ignora todo terreno difícil e não sofre quaisquer penalidades por se mover através dele. Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}, {"n": "Salto Dimensional", "lv": 8, "x": "No 8º nível, você pode se teleportar até 3 metros por nível de clérigo por dia como uma ação de movimento. Esse teleporte deve ser usado em incrementos de 1metro e tal movimento não provoca ataques de oportunidade. Você deve ter linha de visão até o destino para usar esta habilidade. Você pode levar outras criaturas voluntárias com você, mas deve gastar uma quantidade igual de distância para cada criatura levada."}], "spells": [{"c": 1, "n": "Passos Longos"}, {"c": 2, "n": "Salto Dimensional"}, {"c": 3, "n": "Voar"}, {"c": 4, "n": "Porta Dimensional"}, {"c": 5, "n": "Dobrar Espaço e Tempo"}, {"c": 6, "n": "Encontrar o Caminho"}]}, {"id": "trapaca", "name": "Trapaça", "title": "Domínio da Trapaça", "flavor": "Você é um mestre das ilusões e enganos. Blefar, Disfarce e Furtividade são perícias de classe.", "powers": [{"n": "Imitador", "lv": null, "x": "Como uma ação de movimento, você pode criar um duplo ilusório de si mesmo. Esse duplo funciona como uma única imagem espelhada e dura um número de rodadas igual ao seu nível de clérigo, ou até que o duplicado ilusório seja dissipado ou destruído. Você não pode ter mais de um imitador ativo ao mesmo tempo. Esta habilidade não se acumula com a magia imagem espelhada. Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}, {"n": "Ilusão do Mestre", "lv": 8, "x": "No 8º nível, você pode criar uma ilusão que oculta a aparência de você e de qualquer número de aliados dentro de 9 metros por 1 rodada por nível de clérigo. Esta habilidade funciona como a magia véu. A CD do teste para desacreditar este efeito é igual a 8 + proficiencia + seu modificador de Carisma. As rodadas não precisam ser consecutivas."}], "spells": [{"c": 1, "n": "Disfarçar-se"}, {"c": 2, "n": "Desaparecer"}, {"c": 3, "n": "Ilusão de Traição"}, {"c": 4, "n": "Desaparecer Aprimorado"}, {"c": 5, "n": "Dor Falsa"}, {"c": 6, "n": "Enganar"}]}, {"id": "pragas", "name": "Pragas", "title": "Domínio das Pragas", "flavor": "Você enxerga a perfeição da natureza nos membros finos e nas formas estranhas de todas as pragas, grandes ou pequenas.", "powers": [{"n": "Sussurrador das Pragas", "lv": null, "x": "Você pode usar empatia selvagem para influenciar pragas tão facilmente quanto influencia animais, caso ainda não possua essa habilidade. Ao fazê-lo, você concede um mínimo de inteligência implantada às pragas, permitindo que você interaja com elas como se fossem animais. Sussurrador das Pragas funciona apenas em pragas que não possuem mente ou que tenham Inteligência 2 ou menor."}, {"n": "Ferroada Súbita", "lv": 8, "x": "No 8º nível, como uma ação rápida, você pode infligir uma ferroada persistente e dolorosa que exige um ataque de toque corpo a corpo bem-sucedido. Essa ferroada causa 1d4 pontos de dano perfurante + 1 ponto para cada 2 níveis de clérigo que você possua, e o alvo deve ser bem-sucedido em um teste de Constituição ou ficar cambaleante por 1 rodada. Este é um efeito de dor. Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}], "spells": [{"c": 1, "n": "Anular Aroma"}, {"c": 2, "n": "Controlar Pragas"}, {"c": 3, "n": "Espiões Insetos"}, {"c": 4, "n": "Repelir Pragas"}, {"c": 5, "n": "Praga de Insetos"}, {"c": 6, "n": "Chicote de Formigas"}]}, {"id": "vazio", "name": "Vazio", "title": "Domínio do Vazio", "flavor": "Você pode invocar a escuridão fria entre as estrelas para conceder uma loucura de outro mundo.", "powers": [{"n": "Mente Protegida", "lv": null, "x": "Você recebe um bônus de percepção +2 em testes de resistência contra todos os efeitos que afetam a mente."}, {"n": "Rasgar o Véu", "lv": 8, "x": "No 8º nível, você pode imbuir as magias que conjura com a loucura crua que aguarda na escuridão exterior. Ativar esta habilidade é uma ação bonus que deve ser usada ao conjurar uma magia que tenha como alvo uma única criatura e permita um teste de Vontade para negar ou reduzir o efeito principal da magia. Se o alvo falhar em resistir à magia, ele também fica confuso por um número de rodadas igual ao nível da magia, à medida que visões do vazio causam insanidade temporária. A cada rodada, a vítima deve ser bem-sucedida em um novo teste de resistência para encerrar o efeito. Esses testes adicionais se aplicam apenas ao efeito extra de confusão, e não ao efeito original da magia. Rasgar o Véu é um efeito que afeta a mente. Você pode usar esta habilidade um número de vezes por dia igual à metade do seu nível de clérigo."}], "spells": [{"c": 1, "n": "Pena de Chocobo"}, {"c": 2, "n": "Levitar"}, {"c": 3, "n": "Aura do Vazio"}, {"c": 4, "n": "Caminhar no Ar"}, {"c": 5, "n": "Voo"}, {"c": 6, "n": "Cometra"}]}, {"id": "guerra", "name": "Guerra", "title": "Domínio da Guerra", "flavor": "Você é um cruzado do seu deus, sempre pronto e disposto a lutar para defender sua fé.", "powers": [{"n": "Fúria de Batalha", "lv": null, "x": "Você pode tocar uma criatura como uma ação padrão para conceder a ela um bônus nas jogadas de dano corpo a corpo igual à metade do seu nível de clérigo por 1 rodada (mínimo +1). Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}, {"n": "Mestre das Armas", "lv": 8, "x": "No 8º nível, como uma ação bonus, você ganha o uso de um talento de combate por um número de rodadas por dia igual ao seu nível de clérigo. Essas rodadas não precisam ser consecutivas, e você pode mudar o talento escolhido a cada vez que usar esta habilidade. Você deve atender aos pré-requisitos para usar o talento."}], "spells": [{"c": 1, "n": "Arma Mágica"}, {"c": 2, "n": "Têmpera"}, {"c": 3, "n": "Vestimenta Mágica"}, {"c": 4, "n": "Ira da Ordem"}, {"c": 5, "n": "Quebrar Aura"}, {"c": 6, "n": "Golpe Flamejante"}]}, {"id": "agua", "name": "Água", "title": "Domínio da Água", "flavor": "Você pode manipular água e névoa, e é resistente a dano de água.", "powers": [{"n": "Explosão de Água", "lv": null, "x": "Como uma ação padrão, você pode disparar uma rajada de água, tendo como alvo qualquer inimigo a até 9 metros como um ataque de toque à distância. A explosão de água causa 1d6 pontos de dano de água + 1 ponto para cada dois níveis de clérigo que você possua. Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}, {"n": "Resistência à Água", "lv": 6, "x": "No 6º nível, você ganha resistência à água 10. Essa resistência aumenta para 20 no 12º nível. No 20º nível, você ganha imunidade à água."}], "spells": [{"c": 1, "n": "Explosão de Água"}, {"c": 2, "n": "Correnteza"}, {"c": 3, "n": "Respiração Aquática"}, {"c": 4, "n": "Água IV"}, {"c": 5, "n": "Waterga"}, {"c": 6, "n": "Espinhos de Torrente II"}]}, {"id": "clima", "name": "Clima", "title": "Domínio do Clima", "flavor": "Com poder sobre tempestades e céus, você pode invocar a ira dos deuses sobre o mundo abaixo.", "powers": [{"n": "Rajada de Tempestade", "lv": null, "x": "Como uma ação padrão, você pode criar uma rajada de tempestade, tendo como alvo qualquer inimigo a até 9 metros como um ataque de toque à distância. A rajada de tempestade causa 1d6 pontos de dano não letal + 1 ponto para cada dois níveis de clérigo que você possua. Além disso, o alvo é açoitado por ventos e chuva, sofrendo uma penalidade de –2 nas jogadas de ataque por 1 rodada. Você pode usar esta habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}, {"n": "Senhor dos Raios", "lv": 8, "x": "No 8º nível, você pode invocar um número de relâmpagos por dia igual ao seu nível de clérigo. Você pode invocar quantos relâmpagos desejar com uma única ação padrão, mas nenhuma criatura pode ser alvo de mais de um relâmpago e dois alvos não podem estar a mais de 9 metros um do outro. Esta habilidade funciona como a magia invocar relâmpagos."}], "spells": [{"c": 1, "n": "Chuva"}, {"c": 2, "n": "Rajada de Vento"}, {"c": 3, "n": "Explosão de Furacão"}, {"c": 4, "n": "Rio de Vento"}, {"c": 5, "n": "Controlar Ventos"}, {"c": 6, "n": "Caminho dos Ventos"}]}], "orders": [{"id": "arauto-do-caos", "name": "Arauto do Caos", "deity": null, "deityInTitle": false, "intro": ["Muitos daqueles que seguem voluntariamente o Caos buscam semear as vontades de seu mestre, procurando fortalecer seus corpos ao máximo para que possam servir como receptáculos para a manifestação de seu deus no Plano Material."], "facts": {"magias": {"head": "magias de mago negro", "full": "Um arauto do caos conjura magias de mago negro, retiradas da lista de magias de mago negro."}, "pericia": {"head": "Intimidação", "full": "Um arauto do caos adiciona Intimidação à sua lista de perícias de classe. Além disso, ela recebe um bônus em testes de Conhecimento (planos) igual à metade de seu nível de clérigo (mínimo 1)."}, "arma": {"head": "espadas grandes", "full": "Um arauto do caos adiciona espadas grandes à sua lista de proficiências com armas."}}, "castRules": ["Para aprender ou conjurar uma magia de mago negro, o arauto do caos deve possuir um valor de Sabedoria igual ou superior a 10 + o nível da magia (Sab 11 para magias de 1º nível, Sab 12 para magias de 2º nível, e assim por diante).\nA Classe de Dificuldade (CD) para um teste de resistência contra uma magia do arauto do caos é 8 + prificiencia + o modificador de Sabedoria do arauto do caos.\nTodas as magias de mago negro aprendidas pelo arauto do caos utilizam seu modificador de Sabedoria no lugar de Inteligência para todos os efeitos das magias."], "domLede": "Um arauto do caos ganha acesso a dois dos seguintes domínios", "domains": ["caos", "destruicao", "mal", "tempo", "guerra"], "abLede": "Um arauto do caos recebe as seguintes habilidades concedidas por sua divindade à medida que avança de nível.", "abilities": [{"lv": 1, "n": "Lâmina Rebelde", "blocks": [{"t": "p", "x": "No 1º nível, o arauto do caos torna-se uma mestra no uso de sua espada grande para desferir ataques devastadores. Ao empunhar uma espada grande, o arauto do caos pode rerrolar quaisquer resultados 1 obtidos em jogadas de dano."}]}, {"lv": 3, "n": "Praga dos Quatro Demônios", "blocks": [{"t": "p", "x": "A partir do 3º nível, o arauto do caos pode canalizar o poder dos quatro demônios em sua habilidade de canalizar energia. Ao canalizar energia sombria, ela pode gastar um uso adicional de canalizar energia para causar metade do dano normal como dano de terra, fogo, água ou vento, em vez do dano sombrio normal."}, {"t": "p", "x": "No 6º nível, ela pode gastar 1 ponto de fé ou 1 uso de canalizar energia como uma ação bonus para canalizar essa energia em sua espada grande."}]}, {"lv": 6, "n": "Cristalização do Sangue", "blocks": [{"t": "p", "x": "A partir do 6º nível, uma vez por rodada, ao custo de 1 ponto de fé ou 1 uso de canalizar energia, o arauto do caos pode realizar um ataque de corpo a corpo contra um inimigo desmoralizado (afetado por um efeito de medo) para solidificar o sangue em suas veias, como uma ação de movimento."}, {"t": "p", "x": "O oponente sofre 2d6 pontos de dano não elemental, mais 1d6 pontos de dano não elemental para cada três níveis de clérigo após o 6º."}]}, {"lv": 9, "n": "Terror dos Quatro Demônios", "blocks": [{"t": "p", "x": "A partir do 9º nível, o arauto do caos pode gastar 2 pontos de fé ou 2 usos de canalizar energia como uma ação livre para aprimorar a próxima magia que conjurar das escolas elementais (terra, fogo, água ou vento).\nIsso não altera o custo de Slot da magia."}]}, {"lv": 12, "n": "Explosão de Cristalização", "blocks": [{"t": "p", "x": "A partir do 12º nível, quando o arauto do caos estiver usando sua habilidade Cristalização do Sangue, ela pode gastar 1 ponto de fé adicional ou 1 uso de canalizar energia para fazer com que todo inimigo em um raio de 6 metros do alvo inicial realize um teste de resistência de Destreza  ou sofra metade do dano não elemental causado por Cristalização do Sangue."}]}, {"lv": 15, "n": "Aura do Caos", "blocks": [{"t": "p", "x": "A partir do 15º nível, o arauto do caos emana uma aura opressiva e perturbadora que faz com que todos os inimigos em um raio de 3 metros sofram uma penalidade de –4 em testes de resistência contra efeitos de medo."}, {"t": "p", "x": "Criaturas que normalmente são imunes ao medo perdem essa imunidade enquanto estiverem dentro desse raio do arauto do caos.\nEssa habilidade funciona apenas enquanto o arauto do caos permanecer consciente, não surtindo efeito se ela estiver inconsciente ou morta."}]}, {"lv": 18, "n": "Cristal Estilhaçado", "blocks": [{"t": "p", "x": "A partir do 18º nível, quando o arauto do caos estiver usando sua habilidade Cristalização do Sangue, se o ataque de corpo a corpo for bem-sucedido, ela pode gastar 2 pontos de fé adicionais ou 2 usos de canalizar energia para forçar o alvo inicial a realizar um teste de resistência de Constituição ou morrer.\nEste é um efeito de morte."}]}, {"lv": 20, "n": "Caos Eterno", "blocks": [{"t": "p", "x": "No 20º nível, o arauto do caos torna-se capaz de canalizar o poder de sua divindade para viajar através do tempo. Uma vez por dia, como uma habilidade similar à magia, ela pode conjurar regressão temporal, conforme descrito na magia."}]}]}, {"id": "cristalista", "name": "Cristalista", "deity": "Hydaelyn", "deityInTitle": false, "intro": ["Adoradores dos Cristais da Luz recebem poder da Cristal-Mãe, Hydaelyn. Esses magos multifacetados trabalham para promover a harmonia entre as raças – por quaisquer meios necessários."], "facts": {"magias": {"head": "magias do mago celeste", "full": "Um cristalista conjura magias do mago celeste, que são retiradas da lista de magias de mesmo nome"}, "pericia": {"head": "Intimidar", "full": "Um cristalista adiciona Intimidar à sua lista de perícias de classe.\nAlém disso, ela recebe um bônus em testes de Diplomacia igual à metade do seu nível de clériga (mínimo 1)."}, "arma": {"head": "bastões de poder", "full": "Um cristalista adiciona bastões de poder à sua lista de proficiências com armas."}}, "castRules": ["Para aprender ou conjurar uma magia de mago celeste, o cristalista deve possuir um valor de Sabedoria igual a pelo menos 10 + o nível da magia (Sab 11 para magias de 1º nível, Sab 12 para magias de 2º nível, e assim por diante).", "A Classe de Dificuldade (CD) para um teste de resistência contra uma magia do cristalista é 8 + proficiência + o modificador de Sabedoria do cristalista."], "domLede": "Um cristalista ganha acesso a dois dos seguintes domínios", "domains": ["magia", "bem", "cura", "repouso", "sol"], "abLede": "Um cristalista ganha as seguintes habilidades de sua deusa conforme aumenta de nível.", "abilities": [{"lv": 1, "n": "Fragmentos Elementais", "blocks": [{"t": "p", "x": "No 1º nível, o cristalista inicia o jogo com um cristal elemental de sua escolha, concedido diretamente por Hydaelyn em uma visão sobrenatural."}, {"t": "p", "x": "Ao gastar uma ação de rodada completa, um número de vezes por dia igual ao seu modificador de Carisma, o cristalista pode se sintonizar com um desses cristais, encerrando qualquer sintonização anterior."}, {"t": "p", "x": "Os benefícios do cristal duram indefinidamente, mas podem ser desativados como ação livre durante o turno do cristalista."}, {"t": "p", "x": "Efeitos por elemento:"}, {"t": "p", "x": "Trevas: resistência a sombra 10, fraqueza a sagrado, +1d4 de dano de sombra."}, {"t": "p", "x": "Terra: resistência a terra 10, fraqueza a vento, +1d4 de dano de terra."}, {"t": "p", "x": "Fogo: resistência a fogo 10, fraqueza a água, +1d4 de dano de fogo."}, {"t": "p", "x": "Gelo: resistência a gelo 10, fraqueza a fogo, +1d4 de dano de gelo."}, {"t": "p", "x": "Luz: resistência a sagrado 10, fraqueza a sombra, +1d4 de dano sagrado."}, {"t": "p", "x": "Raio: resistência a eletricidade 10, fraqueza a terra, +1d4 de dano elétrico."}, {"t": "p", "x": "Água: resistência a água 10, fraqueza a raio, +1d4 de dano de água."}, {"t": "p", "x": "Vento: resistência a vento 10, fraqueza a gelo, +1d4 de dano de vento."}, {"t": "p", "x": "No 2º nível e a cada três níveis de clérigo, o cristalista tem uma nova visão e recebe um novo cristal elemental."}]}, {"lv": 3, "n": "Magia Cristalina", "blocks": [{"t": "p", "x": "A partir do 3º nível, um número de vezes por dia igual ao modificador de Carisma, o cristalista pode conjurar magias elementais específicas das listas de Mago Negro e Mago Branco, de acordo com o cristal atualmente sintonizado."}, {"t": "p", "x": "Essas magias utilizam Sabedoria no lugar de Inteligência."}, {"t": "h", "x": "Magias por Elemento"}, {"t": "spells", "title": "Trevas", "rows": [["Truque", "Orbe das trevas"], ["1º", "Dark"], ["2º", "Dark II"], ["3º", "Dark III"], ["4º", "Dark IV"], ["5º", "Gloom"], ["6º", "Abyss"]]}, {"t": "spells", "title": "Terra", "rows": [["Truque", "Orbe Elemental"], ["1º", "Stone"], ["2º", "Stone II"], ["3º", "Stone III"], ["4º", "Stone IV"], ["5º", "Crush"], ["6º", "Quake"]]}, {"t": "spells", "title": "Fogo", "rows": [["Truque", "Orbe Elemental"], ["1º", "Fire"], ["2º", "Fire II"], ["3º", "Fire III"], ["4º", "Fire IV"], ["5º", "Burn"], ["6º", "Flare"]]}, {"t": "spells", "title": "Gelo", "rows": [["Truque", "Orbe Elemental"], ["1º", "Blizzard"], ["2º", "Blizzard II"], ["3º", "Blizzard III"], ["4º", "Blizzard IV"], ["5º", "Freeze"], ["6º", "Glacier"]]}, {"t": "spells", "title": "Luz", "rows": [["Truque", "Orbe Sagrado"], ["1º", "Light"], ["2º", "Light II"], ["3º", "Light III"], ["4º", "Light IV"], ["5º", "Bright"], ["6º", "Radiance"]]}, {"t": "spells", "title": "Raio", "rows": [["Truque", "Orbe Elemental"], ["1º", "Thunder"], ["2º", "Thunder II"], ["3º", "Thunder III"], ["4º", "Thunder IV"], ["5º", "Shock"], ["6º", "Burst"]]}, {"t": "spells", "title": "Água", "rows": [["Truque", "Orbe Elemental"], ["1º", "Water"], ["2º", "Water II"], ["3º", "Water III"], ["4º", "Water IV"], ["5º", "Drown"], ["6º", "Flood"]]}, {"t": "spells", "title": "Vento", "rows": [["Truque", "Orbe Elemental"], ["1º", "Aero"], ["2º", "Aero II"], ["3º", "Aero III"], ["4º", "Aero IV"], ["5º", "Slice"], ["6º", "Tornado"]]}, {"t": "p", "x": "Essas magias não são adicionadas à lista regular de magias e só podem ser conjuradas enquanto o cristalista estiver sintonizado com o cristal correspondente."}]}, {"lv": 6, "n": "Elo Cristalino", "blocks": [{"t": "p", "x": "A partir do 6º nível, o cristalista pode conceder temporariamente a um aliado os benefícios do cristal ao qual está sintonizada."}, {"t": "p", "x": "Ação: bônus\nDuração: 1 minuto\nUsos por dia: metade do nível de clérigo"}, {"t": "p", "x": "Enquanto o efeito durar, o cristalista não pode mudar sua sintonização."}, {"t": "p", "x": "Além disso, a sintonização concede um bônus de deslocamento contínuo e um bônus sagrado de +2 em uma perícia específica:"}, {"t": "table", "title": "Tabela – Bônus por Elemento", "head": ["Elemento", "Velocidade", "Bônus de Perícia"], "rows": [["Trevas", "Escalada 3m. (+5m.)", "Intimidar"], ["Terra", "Escalada 3m. (+5m.)", "Lidar com Animais"], ["Fogo", "+3m. deslocamento terrestre", "Intimidar"], ["Gelo", "Natação 3m. (+5m.)", "Diplomacia"], ["Luz", "+3m. deslocamento terrestre", "Diplomacia"], ["Raio", "Voo 3m. (desajeitado)", "Blefar"], ["Água", "Natação 3m. (+5m)", "Blefar"], ["Vento", "Voo 3m. (desajeitado)", "Lidar com Animais"]]}]}, {"lv": 12, "n": "Sintonização Dupla", "blocks": [{"t": "p", "x": "A partir do 12º nível, o cristalista pode se sintonizar com dois cristais ao mesmo tempo, dividindo os efeitos entre eles.\nOs bônus, resistências e magias são reduzidos à metade, mas as fraquezas se acumulam."}, {"t": "p", "x": "Duração máxima: número de rodadas por dia igual ao nível de clérigo."}]}, {"lv": 15, "n": "Sintonização Aprimorada", "blocks": [{"t": "p", "x": "Sintonizar passa a ser ação de movimento\nA sintonização anterior pode permanecer por 1 rodada com metade do efeito"}, {"t": "p", "x": "Bônus de deslocamento +3m. adicionais\nBônus de perícia aumenta para +4"}]}, {"lv": 18, "n": "Sintonização Dupla Aprimorada", "blocks": [{"t": "p", "x": "No 18º nível, ao usar sintonização dupla, o cristalista recebe os benefícios completos de ambos os cristais."}]}, {"lv": 20, "n": "Conjuntos Elementais", "blocks": [{"t": "p", "x": "No 20º nível, a sintonização passa a ser ação bônus e os efeitos melhoram novamente."}, {"t": "p", "x": "Exemplo:"}, {"t": "p", "x": "Trevas: imunidade a sombra, fraqueza a sagrado, +3d4 dano de sombra."}, {"t": "p", "x": "Fogo: imunidade a fogo, resistência a gelo 15, +3d4 dano de fogo.\n(e assim por diante para todos os elementos)"}]}]}, {"id": "cronomante", "name": "Cronomante", "deity": "Zomala", "deityInTitle": false, "intro": ["Cronomantes veneram o Deus do Tempo, Zomala. Esses devotos atuam como os executores de Zomala contra magos do tempo que abusam da cronomancia. Eles caçam ativamente esses magos e, muitas vezes, retiram seus poderes mágicos por um período, punindo-os pelo uso indevido da magia do tempo."], "facts": {"magias": {"head": "magias de cronomancia", "full": "Um cronomante conjura magias de cronomancia, que são obtidas da lista de magias do mago do tempo."}, "pericia": {"head": "Usar Dispositivo Mágico", "full": "Um cronomante adiciona Usar Dispositivo Mágico à sua lista de perícias de classe. Além disso, ele recebe um bônus em testes de Conhecimento (Arcano) igual à metade de seu nível de clérigo (mínimo 1)."}, "arma": {"head": "foice", "full": "Um cronomante adiciona a foice à sua lista de proficiências com armas."}}, "castRules": ["Para aprender ou conjurar uma magia de cronomancia, o cronomante deve possuir um valor de Sabedoria igual a pelo menos 10 + o nível da magia (Sab 11 para magias de 1º nível, Sab 12 para magias de 2º nível, e assim por diante). A Classe de Dificuldade (CD) para um teste de resistência contra uma magia de um cronomante é 8 + proficiência + o modificador de Sabedoria dele.\nTodas as magias de mago do tempo aprendidas pelo cronomante utilizam seu modificador de Sabedoria em vez de Inteligência para todos os efeitos das magias."], "domLede": "Um cronomante recebe acesso a dois dos seguintes domínios", "domains": ["morte", "destruicao", "lei", "tempo", "vazio"], "abLede": "Um cronomante recebe as seguintes habilidades de sua divindade conforme aumenta de nível.", "abilities": [{"lv": 1, "n": "Fragmentos do Tempo", "blocks": [{"t": "p", "x": "Um fragmento é uma minúscula fração de segundo que o cronomante rouba de seu próprio futuro. Os fragmentos retirados são lascas insignificantes de continuidade, tão pequenas que nem mesmo o cronomante percebe sua ausência em suas atividades. No entanto, ele pode usar esses fragmentos para afetar sua linha temporal presente, permitindo refazer ações e desacelerar o tempo ao seu redor, agindo de forma mais cuidadosa e alerta em situações rápidas."}, {"t": "p", "x": "A cada dia, o cronomante possui um reservatório de fragmentos igual a 3 + seu nível de clérigo. Uma vez por rodada, o cronomante pode gastar um fragmento para realizar uma das seguintes ações:"}, {"t": "p", "x": "Receber um bônus em uma jogada de ataque, teste de perícia, teste de habilidade ou teste de resistência. A jogada deve representar uma única ação que ocorra inteiramente dentro de uma única rodada. (Por exemplo, o cronomante pode usar um fragmento para adicionar um bônus em um teste de Acrobacia para saltar um abismo, mas não em um teste de Ofício feito para determinar quanto progresso foi obtido após um dia de trabalho.)\nO bônus concedido é de +1d4, aumentando para +2d4 no 8º nível e +3d4 no 16º nível. O cronomante pode decidir adicionar esse bônus imediatamente após ver o resultado da rolagem original."}, {"t": "p", "x": "Realizar uma bonus que não conta contra o limite normal de uma ação rápida por rodada, desde que seja usada com habilidades de classe de clérigo ou cronomante, ou magias. Isso não aumenta o limite normal de uma magia conjurada como ação rápida por rodada."}, {"t": "p", "x": "Agir na rodada surpresa quando normalmente não poderia fazê-lo."}, {"t": "p", "x": "No 3º nível, o cronomante passa a poder adicionar o bônus de um fragmento do tempo a uma única jogada de dano ou à sua Classe de Armadura (como bônus de esquiva) até o início de seu próximo turno."}, {"t": "p", "x": "No 7º nível, o cronomante pode gastar um fragmento para reduzir a duração de qualquer condição ou efeito negativo que esteja sofrendo. Ao acelerar apenas as influências negativas em sua passagem pelo tempo, ele pode reduzir a duração de uma condição, aflição ou efeito de magia em 1d6 rodadas (mínimo de 0). Esse valor aumenta para 2d6 rodadas no 15º nível."}, {"t": "p", "x": "No 11º nível, o cronomante pode gastar um fragmento para realizar uma ação de movimento como ação bonus."}, {"t": "p", "x": "No 19º nível, o cronomante pode usar um fragmento para conceder a qualquer aliado visível a até 18 metros uma ação de movimento adicional no próximo turno desse aliado."}]}, {"lv": 3, "n": "Defesa Cintilante", "blocks": [{"t": "p", "x": "A partir do 3º nível, toda ação cria novos futuros possíveis, e o cronomante pode forçar futuros particularmente azarados sobre seus inimigos ao observar adiante e deslocar os grãos certos do tempo. Como uma ação imediata, o cronomante pode usar esta habilidade em resposta a um ataque corpo a corpo ou à distância feito contra ele ou contra um aliado a até 18 metros. O atacante sofre uma penalidade de –4 na jogada de ataque e recebe o efeito de status azarado para essa jogada. O cronomante deve ativar esta habilidade antes que o sucesso ou fracasso da jogada original seja conhecido."}, {"t": "p", "x": "Esta habilidade pode ser usada um número de vezes por dia igual a 3 + seu modificador de Carisma."}]}, {"lv": 6, "n": "Contra Temporal", "blocks": [{"t": "p", "x": "No 6º nível, um cronomante pode interromper uma magia de cronomancia que esteja sendo conjurada. Como uma reação, o cronomante pode anular uma magia de cronomancia como se estivesse usando dissipar magia. O cronomante deve primeiro identificar a magia de cronomancia que está sendo conjurada antes de poder usar esta habilidade. Esta habilidade pode ser usada um número de vezes por dia igual ao seu modificador de Carisma."}]}, {"lv": 9, "n": "Rapidez de Zomala", "blocks": [{"t": "p", "x": "No 9º nível, o cronomante abre uma comporta dentro de sua alma, canalizando energias aceleradoras do tempo através de seu corpo para se mover a velocidades cegantes. Como uma ação bonus, uma vez por dia, o cronomante recebe os benefícios da magia velocidade (+1 em jogadas de ataque, iniciativa e testes de Destreza, um bônus de aprimoramento de +9 metros ao deslocamento e um ataque extra ao realizar um ataque total), além de ficar imune à magia lentidão e a efeitos semelhantes."}, {"t": "p", "x": "Além disso, sua velocidade extrema o torna excepcionalmente difícil de atingir; todos os ataques, habilidades sobrenaturais, magias e habilidades similares a magia que tenham como alvo apenas o cronomante sofrem uma chance de falha de -2."}, {"t": "p", "x": "Esta habilidade dura um número de rodadas igual à metade do nível de clérigo (arredondado para baixo). No 12º nível e a cada três níveis thereafter, o cronomante recebe um uso adicional por dia desta habilidade."}]}, {"lv": 12, "n": "Onda Temporal", "blocks": [{"t": "p", "x": "No 12º nível, o cronomante alcança profundamente sua alma e puxa um punhado de quintessência para arremessar contra seus inimigos, causando caos em sua capacidade de agir. Ao usar esta habilidade, ele cria um cone de 9 metros de quintessência. Criaturas atingidas pelo cone devem ser bem-sucedidas em um teste de Constituição ou ficam enjoada e afetadas como se estivessem sob o efeito da magia lentidão por um número de rodadas igual ao seu modificador de Carisma."}, {"t": "p", "x": "Criaturas que obtiverem sucesso no teste de resistência são afetadas como se estivessem sob o efeito de lentidão por 1 rodada. O cronomante pode usar esta habilidade um número de vezes igual ao seu modificador de Carisma."}]}, {"lv": 15, "n": "Ladrão do Tempo", "blocks": [{"t": "p", "x": "No 15º nível, quando o cronomante anula com sucesso uma magia de cronomancia usando Contra Temporal, ele pode usar essa magia em seu próprio turno sem custo. O cronomante deve usar essa magia no turno imediatamente seguinte ao uso de Contra Temporal, ou ela é perdida."}]}, {"lv": 18, "n": "Bloqueador Temporal", "blocks": [{"t": "p", "x": "No 18º nível, o cronomante se torna um mestre em neutralizar magos do tempo, conseguindo bloquear temporariamente sua magia. Sempre que o cronomante anula com sucesso uma magia de cronomancia usando Contra Temporal, o alvo deve realizar um teste de Constituição (CD 17) ou ficará incapaz de conjurar magias de cronomancia por 1 minuto."}, {"t": "p", "x": "Além disso, o cronomante recebe um bônus de +4 em sua habilidade Contra Temporal para anular magias."}]}, {"lv": 20, "n": "Manipulações Temporais", "blocks": [{"t": "p", "x": "No 20º nível, o controle do cronomante sobre sua própria essência temporal permite que ele isole sua ampulheta da realidade, fazendo com que se mova com velocidade e graça incomparáveis e garantindo proteção contra aqueles que tentariam manipular sua quintessência. Como uma ação bonus, uma vez por dia, ele se torna imune às magias lentidão e parar o tempo (time stop) e a efeitos semelhantes, além de não poder ficar fatigado ou exausto."}, {"t": "p", "x": "Ele pode sempre agir na rodada surpresa, mesmo que seja pego desprevenido, e se um aliado ou oponente usar parar o tempo ou um efeito similar enquanto ele estiver a até 15 metros, o cronomante pode realizar uma única ação padrão durante a duração dessa magia ou efeito."}, {"t": "p", "x": "Além disso, ele pode realizar uma ação de movimento ou ação padrão adicional durante seu turno. Esta habilidade dura um número de rodadas igual ao modificador de Carisma do cronomante."}]}]}, {"id": "draconianos", "name": "Draconianos", "deity": "Bahamut", "deityInTitle": true, "intro": ["Discípulos do deus dragão Bahamut, os draconianos reverenciam todas as formas da natureza dracônica. Muitos draconianos são caçadores de emoções a serviço do bem, canalizando seu poder divino de maneiras que lhes permitem enfrentar seus inimigos poderosos de frente, sem hesitação."], "facts": {"magias": {"head": "magias de mago negro", "full": "Um draconiano conjura magias de mago negro, retiradas da lista de magias de mago negro."}, "pericia": {"head": "Intimidação", "full": "Um draconiano adiciona Intimidação à sua lista de perícias de classe. Além disso, ele recebe um bônus em testes de Diplomacia igual à metade do seu nível de clérigo (mínimo 1)."}, "arma": {"head": "espada de cavaleiro", "full": "Um draconiano adiciona a espada de cavaleiro à sua lista de proficiências com armas."}}, "castRules": ["Para aprender ou conjurar uma magia de mago negro, o draconiano deve possuir um valor de Sabedoria igual ou superior a 10 + o nível da magia (Sab 11 para magias de 1º nível, Sab 12 para magias de 2º nível, e assim por diante).\nA Classe de Dificuldade (CD) para um teste de resistência contra uma magia do draconiano é 8 + proficiência + seu modificador de Sabedoria.\nTodas as magias de mago negro aprendidas pelo draconiano utilizam seu modificador de Sabedoria no lugar de Inteligência para todos os efeitos das magias."], "domLede": "Um draconiano ganha acesso a dois dos seguintes domínios", "domains": ["destruicao", "bem", "conhecimento", "lei", "nobreza", "escamados"], "abLede": "Um draconiano recebe as seguintes habilidades concedidas por sua divindade à medida que avança de nível.", "abilities": [{"lv": 1, "n": "Poder do Dragão", "blocks": [{"t": "p", "x": "Os draconianos têm acesso a um poder ligado ao próprio Bahamut, capaz de conceder aos aliados próximos o impulso necessário para superar uma batalha ou de incutir medo no coração daqueles que ousam enfrentar o rei dos dragões.\nO draconiano pode usar esses poderes do dragão um número de vezes por dia igual a 4 + seu modificador de Carisma."}]}, {"lv": 1, "n": "Presença de Bahamut", "blocks": [{"t": "p", "x": "No 1º nível, o draconiano pode elevar a moral de seus aliados, aumentando sua capacidade de combate físico e mágico com este poder do dragão. Como uma ação de movimento, o draconiano pode gastar um poder do dragão para conceder a todos os aliados um bônus de moral de +1 em testes de resistência contra efeitos de encanto e medo, além de um bônus de moral de +1 nas jogadas de ataque e dano."}, {"t": "p", "x": "No 5º nível, e a cada seis níveis de clérigo depois disso, esse bônus aumenta em 1, até um máximo de +4 no 17º nível.\nNo 12º nível, este poder do dragão pode ser ativado como uma ação rápida."}, {"t": "p", "x": "Este poder cria uma aura de 6 metros que permanece ativa, e seu bônus se acumula com outros poderes do dragão.\nA habilidade dura por um número de rodadas igual a 3 + o modificador de Carisma do draconiano e também termina caso o draconiano seja morto, paralisado, atordoado ou fique inconsciente."}]}, {"lv": 3, "n": "Asas de Bahamut", "blocks": [{"t": "p", "x": "No 3º nível, o draconiano pode gastar um poder do dragão para conceder um entre vários bônus a todos os aliados dentro de 4, incluindo ele mesmo. Os aliados devem ser capazes de ver ou ouvir o draconiano para receber o bônus."}, {"t": "p", "x": "Como uma ação bonus, o draconiano pode conceder por 1 rodada um dos seguintes benefícios:"}, {"t": "ul", "items": ["Bônus de esquiva de +2 na CA", "Bônus de moral de +2 em todas as jogadas de ataque", "Redução de dano 2/-", "Resi
