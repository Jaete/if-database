stência a magias igual a 10 + metade do nível de clérigo", "+9 metros de deslocamento"]}, {"t": "p", "x": "O draconiano pode conceder bônus diferentes para cada aliado dentro do alcance que consiga vê-lo e ouvi-lo.\nEsses bônus aumentam em +1 a cada três níveis de clérigo após o 3º.\nNo 10º nível, o alcance deste poder do dragão aumenta em 4."}]}, {"lv": 6, "n": "Carga de Bahamut", "blocks": [{"t": "p", "x": "No 6º nível, ao realizar um ataque de investida, o draconiano pode ativar este poder do dragão como parte da investida, usando uma ação bonus."}, {"t": "p", "x": "Quando faz isso, todos os aliados dentro de 9 metros também podem se mover até seu deslocamento e realizar um ataque corpo a corpo como uma reação.\nTodos os ataques são feitos com um bônus de +1 (que se acumula com o bônus da investida), e todos os aliados recebem um bônus de esquiva de +1 na CA por 1 rodada."}, {"t": "p", "x": "Esses bônus aumentam em +1 a cada quatro níveis de clérigo após o 6º, até um máximo de +4 no 18º nível."}]}, {"lv": 9, "n": "Rugido de Bahamut", "blocks": [{"t": "p", "x": "No 9º nível, o draconiano pode imitar o rugido de Bahamut com este poder do dragão e, como uma reação, rugir contra um inimigo a até 9 metros que tente atacar um aliado ou o próprio draconiano."}, {"t": "p", "x": "O draconiano realiza um teste de Diplomacia contra a jogada de ataque do inimigo e, se for bem-sucedido, o ataque é anulado e o inimigo deve realizar um teste de resistência de Constituição (CD 8 + proficiencia + o modificador de Carisma do draconiano) ou dar imediatamente um passo de 1 para longe de seu alvo."}, {"t": "p", "x": "O inimigo deve ser capaz de ouvir o draconiano para ser afetado."}]}, {"lv": 12, "n": "Olho de Bahamut", "blocks": [{"t": "p", "x": "Um draconiano de 12º nível pode usar seu poder do dragão, como uma ação padrão, para causar medo em um único inimigo a até 9 metros, invocando o olho de Bahamut para incutir terror nos movimentos do oponente.\nO alvo deve realizar um teste de resistência de Constituição  ou ficará abalado.\nSe o alvo falhar no teste por 5 ou mais, ele ficará assustado.\nSe falhar por 10 ou mais, ele ficará em pânico.\nSe o alvo obtiver um 1 natural no teste de Constituição, ele ficará paralisado."}, {"t": "p", "x": "A duração desses efeitos de condição é igual ao modificador de Carisma do draconiano, em rodadas."}]}, {"lv": 15, "n": "Liderança de Bahamut", "blocks": [{"t": "p", "x": "Um draconiano de 15º nível pode usar um poder do dragão, como ação padrão, para inspirar seus aliados dentro de 9 metros, concedendo a eles um bônus em todos os testes de resistência e aumentando a CD de todas as habilidades de seus aliados (habilidades extraordinárias, sobrenaturais, magias, habilidades mágicas, etc.) em um valor igual ao modificador de Carisma do draconiano, por 1 rodada."}]}, {"lv": 18, "n": "Ira de Bahamut", "blocks": [{"t": "p", "x": "Um draconiano de 18º nível pode usar um poder do dragão, como ação padrão, para abençoar a si mesmo ou um aliado dentro de 9 metros que ele possa ver com o poder de Bahamut, concedendo +1d6 em todas as jogadas de dano para cada quatro níveis de clérigo após o 1º.\nEssa habilidade dura por um número de rodadas igual ao modificador de Carisma do draconiano."}]}, {"lv": 20, "n": "Rei dos Dragões", "blocks": [{"t": "p", "x": "Provando ser um verdadeiro discípulo do rei dos dragões, o draconiano pode se tornar o avatar de Bahamut, adquirindo a forma e as habilidades de um Bahamut de 20º nível (avatar de invocador), utilizando seus níveis de clérigo no lugar dos níveis de invocador."}, {"t": "p", "x": "Ele pode escolher fazer com que qualquer equipamento que esteja carregando seja absorvido por sua nova forma. Itens com efeitos contínuos continuam funcionando enquanto absorvidos dessa maneira.\nO clérigo perde seus ataques naturais e todos os traços raciais (exceto talentos bônus, perícias e idiomas), substituídos pelas habilidades concedidas por seu avatar. O draconiano mantém todas as suas habilidades de classe."}, {"t": "p", "x": "O draconiano pode manter essa forma por um número de minutos por dia igual ao seu nível de clérigo. Essa duração não precisa ser consecutiva, mas deve ser utilizada em incrementos mínimos de 1 minuto. Ele pode encerrar esse efeito como uma ação livre."}, {"t": "p", "x": "Enquanto estiver nessa forma, todos os aliados que vejam e ouçam o draconiano recebem os efeitos do talento duro de matar e tornam-se imunes a efeitos de encanto, medo e compulsão."}]}]}, {"id": "fragmentado", "name": "Fragmentados", "deity": "Zodiark", "deityInTitle": false, "intro": ["Os Fragmentados são aqueles que caíram sob o olhar de Zodiark, o deus sombrio que aguarda no coração da criação. Embora eles e muitos de seus fiéis ou servos dominados tenham sido fragmentados, a centelha obscura de seus verdadeiros eus permaneceu intacta, adormecida, aguardando para ser despertada."], "facts": {"magias": {"head": "magias de Ilusionista", "full": "Um Fragmentado conjura magias de Ilusionista, retiradas da lista de magias de Ilusionista."}, "pericia": {"head": "Blefar (Car)", "full": "O Fragmentado adiciona Blefar (Car) à sua lista de perícias de classe.\nAlém disso, ele recebe um bônus em Conhecimento (Planos) igual à metade de seu nível de clérigo (mínimo 1)."}, "arma": {"head": "bastões", "full": "O Fragmentado adiciona bastões à sua lista de proficiências com armas."}}, "castRules": ["Para aprender ou conjurar uma magia de ilusão, o Fragmentado deve possuir um valor de Sabedoria igual a pelo menos 10 + o nível da magia (Sab 11 para magias de 1º nível, Sab 12 para magias de 2º nível, e assim por diante).", "A Classe de Dificuldade (CD) para resistir às magias de um Fragmentado é 8 + proficiência + o modificador de Sabedoria dele.\nTodas as magias de Ilusão aprendidas pelo Fragmentado utilizam o modificador de Sabedoria em vez de Carisma para todos os efeitos das magias."], "domLede": "O Fragmentado ganha acesso a dois dos seguintes domínios", "domains": ["escuridao", "caos", "destruicao", "morte", "vazio"], "abLede": "À medida que o Fragmentado sobe de nível, ele recebe as seguintes habilidades concedidas por sua divindade.", "abilities": [{"lv": 1, "n": "Presságio Sombrio", "blocks": [{"t": "p", "x": "No 1º nível, o Fragmentado desperta para sua verdadeira natureza. Ao tocar a escuridão do início de todas as coisas, ele a distorce em poder e forma."}, {"t": "p", "x": "O Fragmentado adiciona a linha de magias Dark (Dark I–IV, Darkra e Darkga) às magias disponíveis para serem adicionadas à sua lista de magias."}]}, {"lv": 3, "n": "Passo Umbral", "blocks": [{"t": "p", "x": "No 3º nível, até 3 vezes por dia, mais 1 vez adicional por dia a cada três níveis de clérigo após o 3º, o Fragmentado pode, como ação padrão, atravessar a escuridão."}, {"t": "p", "x": "Ele entra no Plano das Sombras e retorna no início de seu próximo turno. Dentro do Plano das Sombras, o Fragmentado só pode se mover a metade do deslocamento."}, {"t": "p", "x": "Se for atingido por um ataque, o Fragmentado pode gastar 2 usos dessa habilidade como ação imediata para reduzir o dano recebido pela metade. Se usada dessa forma, ele ainda pode realizar sua ação de movimento (a metade do deslocamento) antes de retornar em seu próximo turno."}]}, {"lv": 6, "n": "Criação Consciente", "blocks": [{"t": "p", "x": "No 6º nível, como ação livre ao conjurar uma magia de ilusão de 1º nível ou superior, o Fragmentado pode, um número de vezes por dia igual ao seu modificador de Carisma, escolher um objeto inanimado e não mágico que faça parte da ilusão para se tornar real."}, {"t": "p", "x": "Ele deve ser capaz de agir para fazê-lo, e o objeto permanece real até o final do próximo turno do Fragmentado."}, {"t": "p", "x": "O objeto pode ter qualquer tamanho, desde que esteja dentro da área de efeito da magia.\nExemplo: o Fragmentado pode criar a ilusão de uma ponte sobre um abismo e torná-la real tempo suficiente para seus aliados atravessarem."}, {"t": "p", "x": "O objeto não pode causar dano nem ferir diretamente outra criatura de nenhuma forma."}]}, {"lv": 9, "n": "O Epíteto Verdadeiro", "blocks": [{"t": "p", "x": "No 9º nível, o Fragmentado descobre seu verdadeiro propósito e passa a invocar seu nome verdadeiro, extraindo poder dele."}, {"t": "p", "x": "Uma vez por dia, quando a iniciativa é rolada, ele pode ativar seu epíteto, que dura até:\no fim do combate,\n1 minuto se passar,\nou o Fragmentado ficar inconsciente."}, {"t": "p", "x": "Seu nome se manifesta como um glifo vermelho visível, flutuando acima de seu rosto, único para cada Fragmentado."}, {"t": "p", "x": "Ao adquirir essa habilidade, o Fragmentado escolhe a natureza de seu glifo:"}, {"t": "p", "x": "Criador: aumenta seu nível de conjurador em +1 e a CD de suas magias de ilusão em +1.\nExplorador: ganha Percepção às Cegas (9 m) e Telepatia (18 m), podendo compartilhar essa percepção com aliados dentro do alcance sem palavras ou gestos.\nCurador: pode conjurar magias Dark em aliados para curá-los. Isso não funciona em criaturas vivas que tenham causado dano Sagrado no combate atual.\nProtetor: aliados a até 9 m recebem RD 2/- e Resistência Sagrada/Sombria 5 (não acumula com outras fontes).\nErudito: escolhe um elemento (exceto Sagrado) e pode converter magias Dark para esse elemento.\nGuerreiro: ganha 2 ataques naturais de garra (1d4 médio, 1d3 pequeno), que causam +1d6 de dano Sombrio cada, usando o modificador de Carisma para ataque e dano."}]}, {"lv": 12, "n": "Manipulação Universal", "blocks": [{"t": "p", "x": "No 12º nível, um número de vezes por dia igual ao modificador de Carisma, quando o Fragmentado conjura uma magia de Ilusão de 1º nível ou superior, ele pode aplicar um dos seguintes efeitos:"}, {"t": "p", "x": "Afirmação da Realidade: qualquer criatura que tente perceber a ilusão rola duas vezes e fica com o pior resultado.\nReverberação: um alvo a até 18 m sofre 1d6 de dano Sombrio por nível da magia. Um teste de Constituição bem-sucedido reduz o dano pela metade. Esse efeito não denuncia a ilusão.\nRevelação da Centelha: criaturas que falharem ao tentar perceber a ilusão ficam Amedrontadas por 1 rodada + modificador de Carisma."}]}, {"lv": 15, "n": "Passagem das Trevas", "blocks": [{"t": "p", "x": "No 15º nível, fora de combate, o Fragmentado pode:"}, {"t": "p", "x": "gastar 2 usos de Passo Umbral para se deslocar grandes distâncias, como Porta Dimensional;\ngastar 4 usos para Distorcer Espaço e Tempo;\ngastar 8 usos para viajar entre planos, como Mudança de Plano.\nEle pode gastar 2 usos adicionais para rolar duas vezes no d100, ficando com o melhor resultado."}]}, {"lv": 18, "n": "Trevas Ascendentes", "blocks": [{"t": "p", "x": "No 18º nível, quando um aliado a até 9 m acerta um ataque, o Fragmentado pode usar uma reação para adicionar 4d8 de dano Sombrio ao ataque."}, {"t": "p", "x": "Se qualquer dado tirar o valor máximo, ele escolhe um dos efeitos:"}, {"t": "p", "x": "ganha uma ação rápida extra no próximo turno;\nrecupera 1d4 slot;\ncura a si mesmo em valor igual ao dano causado."}, {"t": "p", "x": "Pode ser usada 3 vezes por dia.\nEm um local sagrado de Zodiark ou em trevas profundas, o uso é ilimitado, mas cada efeito só pode ser escolhido duas vezes antes do próximo turno."}]}, {"lv": 20, "n": "Sombra Efêmera", "blocks": [{"t": "p", "x": "No 20º nível, o Fragmentado compreende plenamente a natureza partida do mundo, de seu deus e de si mesmo."}, {"t": "p", "x": "Uma vez por dia, se morrer, a menos que seja morto por uma arma de Auracita, Cristal ou outro material especial (a critério do mestre) após sofrer dano Sagrado nos últimos 2 turnos, seu corpo ressuscita imediatamente, como a magia Arise."}, {"t": "p", "x": "O Fragmentado sente instintivamente a direção vaga da criatura ou objeto que o matou, por um número de meses igual ao seu modificador de Carisma."}, {"t": "p", "x": "Além disso, ele pode usar O Epíteto Verdadeiro duas vezes por dia."}]}]}, {"id": "guardiao-aeon", "name": "Guardiões Aeon", "deity": "Minerva", "deityInTitle": true, "intro": ["Guardiões Aeon veneram a Deusa do Mana, Minerva. Em sua neutralidade e domínio sobre os ciclos da vida, os guardiões aeon ajudam as pessoas a seguirem para sua próxima vida, assim como auxiliam aqueles que ainda possuem tempo restante nesta existência. Controlando o fluxo e o refluxo tanto da saúde quanto da magia, os guardiões aeon também conseguem manter seus aliados em condições ideais."], "facts": {"magias": {"head": "magias de magia branca", "full": "Um guardião aeon conjura magias de magia branca, extraídas da lista de magias do mago branco."}, "pericia": {"head": "Conhecimento (Natureza)", "full": "Um guardião aeon adiciona Conhecimento (Natureza) à sua lista de perícias de classe. Além disso, ela recebe um bônus em testes da perícia Cura igual à metade de seu nível de clérigo (mínimo 1)."}, "arma": {"head": "bastões ou cajados de poder", "full": "Um guardião aeon adiciona bastões ou cajados de poder à sua lista de proficiências com armas."}}, "castRules": ["Para aprender ou conjurar uma magia de magia branca, o guardião aeon deve possuir Sabedoria igual ou superior a 10 + o nível da magia (Sab 11 para magias de 1º nível, Sab 12 para magias de 2º nível, e assim por diante). A Classe de Dificuldade para testes de resistência contra uma magia de um guardião aeon é 10 + o nível da magia + o modificador de Sabedoria dela."], "domLede": "Um guardião aeon recebe acesso a dois dos seguintes domínios", "domains": ["animais", "terra", "cura", "magia", "repouso"], "abLede": "Um guardião aeon recebe as seguintes habilidades de sua divindade conforme aumenta de nível.", "abilities": [{"lv": 1, "n": "Ensinamentos de Minerva", "blocks": [{"t": "p", "x": "No 1º nível, o guardião aeon recebe um bônus de +2 em todos os testes de Cura e Sobrevivência. Ele reduz em 1 o número de usos de kits ao utilizar a perícia Cura (mínimo 0). Esta habilidade acumula com o talento Autossuficiente."}]}, {"lv": 3, "n": "Linha Vital Estendida", "blocks": [{"t": "p", "x": "Um guardião aeon de 3º nível ou superior pode fornecer cuidados prolongados a 12 pacientes ao mesmo tempo, tratar ferimentos letais duas vezes por paciente e pode tratar a si mesmo por meio da perícia Cura. Ele também pode curar um único alvo em 1d4 por nível (caso tenha magias de cura) como uma ação de rodada completa; isso pode ser feito um número de vezes por dia igual a 3 + o modificador de Carisma dela."}]}, {"lv": 6, "n": "Canalização Ampliada", "blocks": [{"t": "p", "x": "Um guardião aeon de 6º nível ou superior pode aumentar o raio de sua habilidade de canalizar energia em 9m. Esta habilidade pode ser usada um número de vezes por dia igual ao modificador de Carisma."}]}, {"lv": 9, "n": "Curandeiro Especialista", "blocks": [{"t": "p", "x": "Um guardião aeon de 9º nível ou superior adiciona seu modificador de Carisma e seu nível de classe à sua habilidade uma habilidade mágica de suporte 1x por aventura."}, {"t": "p", "x": "no 12º nível essa habilidade é melhorada para 1x por descanso longo"}]}, {"lv": 12, "n": "Atraso da Degradação", "blocks": [{"t": "p", "x": "Um guardião aeon de 12º nível ou superior pode gastar um uso de seu slot para tentar remover um efeito de condição de mesmo circulo, veneno ou doença de um alvo, usando seu próprio teste de resistência no lugar do teste do alvo. Se o teste de resistência falhar, o efeito é adiado por um número de rodadas igual ao modificador de Carisma do guardião aeon. O efeito é considerado como dissipado durante a duração do atraso, mas retorna após o término desse período."}]}, {"lv": 15, "n": "Canalizar Força Vital", "blocks": [{"t": "p", "x": "Um guardião aeon de 15º nível ou superior pode gastar um uso de seu slot para causar sangramento (a quantidade de slot que gastar equivale ao dano) em todos os inimigos dentro de 9m, a menos que obtenham sucesso em um teste de Constituição (CD 8 + proficiencia + o modificador de Carisma dela). Para cada alvo afetado por sangramento, o guardião aeon pode conceder Cura Rápida igual ao seu modificador de Carisma a um aliado dentro de 9m pés; este efeito dura até que os inimigos removam o efeito de sangramento ou sejam mortos."}]}, {"lv": 18, "n": "Reencarnação Nepotista", "blocks": [{"t": "p", "x": "Como uma ação de rodada completa, um guardião aeon de 18º nível ou superior pode gastar um slot de 3º circulo para curar um alvo morto dentro de 9m como se fosse uma cura de circulo igual, trazendo-o de volta à vida com pontos de vida iguais à quantidade curada. O alvo pode estar morto por até 3 horas."}]}, {"lv": 20, "n": "Renovação de Minerva", "blocks": [{"t": "p", "x": "No 20º nível, um guardião aeon domina a vida e a morte. Uma vez por dia, sempre que um guardião aeon for morto, ele ressuscita uma rodada depois como se estivesse sob o efeito de uma magia de ressurreição. Além disso, ele adquire o subtipo extraplanar, deixa de envelhecer (embora quaisquer efeitos de envelhecimento já acumulados permaneçam). Entretanto, ele perde proficiência em uma pericia (a escolha do jogador). Quando não se tiver mais proficiencias em nenhuma pericia, ele passa a perder habilidades, até não ter mais nada a oferecer e enfim morrer de vez."}]}]}, {"id": "harmonico-de-cosmos", "name": "Harmônico de Cosmos", "deity": null, "deityInTitle": false, "intro": ["Os Harmônicos de Cosmos são clérigos que escutam a música silenciosa do universo e escolhem protegê-la. Diferente de ordens que impõem ordem ou espalham ruína, esses devotos atuam como mediadores do inevitável, guiando vida, morte e conflito para um estado de harmonia em movimento."], "facts": {"magias": {"head": "magias de mago branco", "full": "Um Harmônico de Cosmos conjura magias de mago branco, retiradas da lista de magias de mago branco."}, "pericia": {"head": "Diplomacia", "full": "Um Harmônico de Cosmos adiciona Diplomacia à sua lista de perícias de classe. Além disso, ele recebe um bônus em testes de Cura e Conhecimento (religião) igual à metade de seu nível de clérigo (mínimo 1)."}, "arma": {"head": "alfachion, lança ou arco longo", "full": "Um Harmônico de Cosmos adiciona alfachion, lança ou arco longo à sua lista de proficiências com armas."}}, "castRules": ["Para aprender ou conjurar uma magia de mago branco, o Harmônico de Cosmos deve possuir um valor de Sabedoria igual ou superior a 10 + o nível da magia (Sab 11 para magias de 1º nível, Sab 12 para magias de 2º nível, e assim por diante).", "A Classe de Dificuldade (CD) para um teste de resistência contra uma magia do Harmônico de Cosmos é:\n8 + proficiência + o modificador de Sabedoria do Harmônico de Cosmos.", "Todas as magias de mago branco aprendidas pelo Harmônico de Cosmos utilizam seu modificador de Sabedoria no lugar de Inteligência para todos os efeitos das magias."], "domLede": "Um Harmônico de Cosmos ganha acesso a dois dos seguintes domínios", "domains": ["comunidade", "morte", "gloria", "bem", "cura", "protecao"], "abLede": "Um Harmônico de Cosmos recebe as seguintes habilidades concedidas por sua divindade à medida que avança de nível.", "abilities": [{"lv": 1, "n": "Nota da Harmonia", "blocks": [{"t": "p", "x": "No 1º nível, o Harmônico de Cosmos aprende a lutar e agir em perfeita sintonia com o ritmo do universo."}, {"t": "p", "x": "Sempre que o Harmônico de Cosmos conceder cura a um aliado ou auxiliar um aliado em um teste ou ataque, esse aliado recebe um bônus adicional de +1 na próxima jogada de ataque, teste de resistência ou teste de habilidade que realizar até o início do próximo turno do Harmônico."}]}, {"lv": 3, "n": "Cântico da Aurora", "blocks": [{"t": "p", "x": "A partir do 3º nível, o Harmônico de Cosmos pode canalizar a luz harmônica da deusa em sua habilidade de canalizar energia."}, {"t": "p", "x": "Ao canalizar energia positiva, ele pode gastar um uso adicional de canalizar energia para converter metade da cura total em um escudo de luz que permanece nos alvos curados.\nEsse escudo concede pontos de vida temporários iguais à metade do valor curado e dura por 1 minuto."}, {"t": "p", "x": "No 6º nível, o Harmônico pode gastar 1 ponto de fé ou 1 uso de canalizar energia como uma ação bônus para canalizar essa energia diretamente em um aliado tocado, fortalecendo apenas esse alvo."}]}, {"lv": 6, "n": "Passagem Serena", "blocks": [{"t": "p", "x": "A partir do 6º nível, uma vez por rodada, ao custo de 1 ponto de fé ou 1 uso de canalizar energia, o Harmônico de Cosmos pode tocar uma criatura viva ou moribunda como uma ação de movimento."}, {"t": "p", "x": "Escolha um dos efeitos:\nA criatura recupera 2d6 pontos de vida, mais 1d6 adicional para cada três níveis de clérigo após o 6º, ou\nSe a criatura estiver sob efeitos de medo, encanto ou compulsão, um desses efeitos é imediatamente removido.\nSe a criatura estiver morrendo, ela estabiliza automaticamente e recupera 1 ponto de vida."}]}, {"lv": 9, "n": "Ritmo da Existência", "blocks": [{"t": "p", "x": "A partir do 9º nível, o Harmônico de Cosmos pode gastar 2 pontos de fé ou 2 usos de canalizar energia como uma ação livre para harmonizar a próxima magia que conjurar."}, {"t": "p", "x": "A próxima magia de cura, proteção ou luz que ele conjurar:"}, {"t": "ul", "items": ["Não provoca ataques de oportunidade"]}, {"t": "p", "x": "Concede vantagem (ou bônus equivalente, conforme o sistema) no primeiro teste de resistência relacionado ao efeito da magia"}, {"t": "p", "x": "Esse poder não altera o custo de slot da magia."}]}, {"lv": 12, "n": "Ressonância Restauradora", "blocks": [{"t": "p", "x": "A partir do 12º nível, quando o Harmônico de Cosmos utilizar sua habilidade Passagem Serena, ele pode gastar 1 ponto de fé adicional ou 1 uso adicional de canalizar energia para fazer com que todos os aliados em um raio de 6 metros do alvo principal recuperem metade do valor de cura aplicado ou recebam metade dos efeitos de remoção de condições."}, {"t": "p", "x": "Essa cura secundária nunca gera pontos de vida temporários."}]}, {"lv": 15, "n": "Aura da Harmonia", "blocks": [{"t": "p", "x": "A partir do 15º nível, o Harmônico de Cosmos emana uma aura serena e luminosa que afeta todos os aliados em um raio de 6 metros."}, {"t": "p", "x": "Aliados dentro da aura recebem:"}, {"t": "ul", "items": ["+2 em testes de resistência contra medo, encanto e compulsão", "Imunidade à condição abalado"]}, {"t": "p", "x": "Além disso, sempre que um aliado dentro da aura cair a 0 pontos de vida, ele não fica inconsciente imediatamente, permanecendo consciente até o início do próximo turno."}, {"t": "p", "x": "Essa habilidade funciona apenas enquanto o Harmônico de Cosmos estiver consciente."}]}, {"lv": 18, "n": "Véu da Aurora", "blocks": [{"t": "p", "x": "A partir do 18º nível, quando um aliado a até 6 metros do Harmônico de Cosmos sofreria um efeito de morte, dano massivo ou redução a 0 pontos de vida, o Harmônico pode gastar 2 pontos de fé adicionais ou 2 usos de canalizar energia como uma reação."}, {"t": "p", "x": "O efeito é anulado e o aliado:"}, {"t": "ul", "items": ["Recupera 4d6 pontos de vida, mais 1d6 por nível de clérigo após o 18º", "Torna-se imune a medo e encantamento por 1 minuto"]}, {"t": "p", "x": "Esse poder só pode ser usado uma vez por rodada."}]}, {"lv": 20, "n": "Aurora Eterna", "blocks": [{"t": "p", "x": "No 20º nível, o Harmônico de Cosmos torna-se um verdadeiro condutor da melodia universal."}, {"t": "p", "x": "Uma vez por dia, como uma habilidade similar à magia, ele pode invocar a Aurora Eterna por 1 minuto:"}, {"t": "p", "x": "Todos os aliados a até 12 metros recuperam pontos de vida iguais ao modificador de Sabedoria do Harmônico no início de cada turno"}, {"t": "p", "x": "Aliados não podem morrer enquanto o efeito durar (não podem cair abaixo de 1 ponto de vida)"}, {"t": "p", "x": "Efeitos de medo, compulsão e encanto são automaticamente suprimidos na área"}, {"t": "p", "x": "Quando a Aurora Eterna termina, o Harmônico de Cosmos fica exaurido, mas em paz, como se tivesse cumprido seu papel no grande ciclo."}]}]}, {"id": "kefkanita", "name": "Kefkanita", "deity": "Kefka", "deityInTitle": false, "intro": ["Um seguidor fiel de Kefka, imbuído de sua personalidade demente e megalomaníaca, busca conquistar o favor de seu deus. Kefkanitas são criaturas territoriais, sempre tentando ser aquele que Kefka escolherá como seu avatar para governar em seu nome."], "facts": {"magias": {"head": "magias negras", "full": "Um kefkanita conjura magias negras, retiradas da lista de magias do Mago Negro."}, "pericia": {"head": "Intimidar", "full": "Um kefkanita adiciona Intimidar à sua lista de perícias de classe.\nAlém disso, ele recebe um bônus em testes de Conhecimento (Arcano) igual à metade do seu nível de clérigo (mínimo 1)."}, "arma": {"head": "mangual", "full": "Um kefkanita adiciona mangual à sua lista de proficiências com armas."}}, "castRules": ["Para aprender ou conjurar uma magia negra, o kefkanita deve possuir um valor de Sabedoria igual a pelo menos 10 + o nível da magia (Sab 11 para magias de 1º nível, Sab 12 para magias de 2º nível, e assim por diante).", "A Classe de Dificuldade (CD) para um teste de resistência contra uma magia do kefkanita é 8 + proficiência + o modificador de Sabedoria dele."], "domLede": "Um kefkanita ganha acesso a dois dos seguintes domínios", "domains": ["caos", "destruicao", "mal", "magia", "trapaca"], "abLede": "Um kefkanita ganha as seguintes habilidades de sua divindade conforme aumenta de nível.", "abilities": [{"lv": 1, "n": "Zombaria Cortante", "blocks": [{"t": "p", "x": "Um kefkanita é treinado para usar a perícia Intimidar a fim de criar efeitos mágicos naqueles ao seu redor. Ele pode usar essa habilidade por um número de rodadas por dia igual a 4 + seu modificador de Carisma."}, {"t": "p", "x": "A cada nível após o 1º, um kefkanita pode usar zombaria cortante por 2 rodadas adicionais por dia."}, {"t": "p", "x": "A cada rodada, o kefkanita pode produzir um dos tipos de zombaria cortante que tenha dominado, conforme indicado por seu nível. Iniciar uma zombaria cortante é uma ação padrão, mas ela pode ser mantida a cada rodada como uma ação livre."}, {"t": "p", "x": "Trocar o efeito de uma zombaria cortante exige que o kefkanita encerre a zombaria anterior e inicie uma nova como uma ação padrão."}, {"t": "p", "x": "Uma zombaria cortante não pode ser interrompida, mas termina imediatamente se o kefkanita for morto, paralisado, atordoado, ficar inconsciente ou for impedido de realizar a ação livre necessária para mantê-la a cada rodada."}, {"t": "p", "x": "Um kefkanita não pode manter mais de uma zombaria cortante ativa ao mesmo tempo."}, {"t": "p", "x": "Cada zombaria cortante possui componentes audíveis, visuais ou ambos:"}, {"t": "p", "x": "Se possuir componentes audíveis, os alvos devem ser capazes de ouvir o kefkanita, e a zombaria depende de linguagem. Um kefkanita surdo possui -2 ao tentar usar uma zombaria com componente audível. Em caso de falha, o uso ainda conta contra o limite diário. Criaturas surdas são imunes a zombarias com componentes audíveis."}, {"t": "p", "x": "Se possuir componentes visuais, os alvos devem ter linha de visão com o kefkanita. Um kefkanita cego possui desvantagem ao tentar usar uma zombaria com componente visual. Em caso de falha, o uso ainda conta contra o limite diário. Criaturas cegas são imunes a zombarias com componentes visuais."}, {"t": "p", "x": "No 7º nível, um kefkanita pode iniciar uma zombaria cortante como ação de movimento em vez de ação padrão.\nNo 13º nível, ele pode iniciá-la como ação bonus."}]}, {"lv": 1, "n": "O Olhar de Kefka", "blocks": [{"t": "p", "x": "Um kefkanita de 1º nível pode usar sua zombaria para causar covardia em seus inimigos, desmoralizando-os contra efeitos de medo e prejudicando suas capacidades de combate."}, {"t": "p", "x": "Para ser afetada, a criatura deve ser capaz de perceber a zombaria do kefkanita. Uma criatura afetada sofre:"}, {"t": "ul", "items": ["–1 em testes de resistência contra efeitos de encanto e medo", "–1 em jogadas de ataque e dano com armas"]}, {"t": "p", "x": "No 5º nível, e a cada quatro níveis de clérigo, essa penalidade aumenta em –1."}, {"t": "p", "x": "O olhar de Kefka é uma habilidade que afeta a mente e depende de componentes visuais para funcionar."}]}, {"lv": 3, "n": "O Escárnio de Kefka", "blocks": [{"t": "p", "x": "Um kefkanita de 3º nível pode usar sua zombaria para fazer com que uma ou mais criaturas fiquem furiosas contra ele."}, {"t": "p", "x": "Cada criatura a ser ridicularizada deve estar a até 27 metros, ser capaz de ver, ouvir e entender o kefkanita, além de ser capaz de prestar atenção nele. O kefkanita também deve conseguir ver as criaturas afetadas."}, {"t": "p", "x": "Para cada três níveis além do 3º, o kefkanita pode afetar uma criatura adicional."}, {"t": "p", "x": "Cada criatura dentro do alcance realiza um teste de Constituição."}, {"t": "p", "x": "Se o teste for bem-sucedido, o kefkanita não pode ridicularizar essa criatura novamente por 24 horas."}, {"t": "p", "x": "Se falhar, a criatura fica enfurecida pela zombaria e tenta ferir o kefkanita."}, {"t": "p", "x": "Enquanto o kefkanita mantiver o escárnio, o alvo sofre –2 em todas as jogadas de ataque e testes de perícia, até conseguir atingir o kefkanita com um ataque corpo a corpo ou à distância, ou causar dano a ele com uma magia ofensiva."}, {"t": "p", "x": "O escárnio de Kefka é uma habilidade debilitante que afeta a mente, e depende de componentes audíveis e visuais."}]}, {"lv": 6, "n": "A Visão de Kefka", "blocks": [{"t": "p", "x": "Um kefkanita de 6º nível pode usar sua zombaria para inundar a mente de um inimigo com memórias conjuradas."}, {"t": "p", "x": "Os alvos devem estar a até 9 metros do kefkanita e ser capazes de perceber sua zombaria. Para cada três níveis além do 6º, o kefkanita pode afetar uma criatura adicional."}, {"t": "p", "x": "Cada criatura dentro do alcance realiza um teste de Constituição para negar o efeito."}, {"t": "p", "x": "Se obtiver sucesso, o kefkanita não poderá usar a Visão de Kefka novamente nessa criatura por 24 horas."}, {"t": "p", "x": "Se falhar, o kefkanita preenche a mente do alvo com imagens e vozes subconscientes, distraindo-o de uma das seguintes formas (escolhida pelo kefkanita ao iniciar a zombaria):"}, {"t": "ul", "items": ["–2 para atingir um alvo específico escolhido pelo kefkanita", "–2 no dano de armas corpo a corpo e à distância", "O alvo deve realizar um teste de Concentração ao conjurar sua próxima magia; falha anula os efeitos da magia", "Penalidade igual ao modificador de Carisma do kefkanita em uma perícia à escolha dele", "–2 em um teste de resistência à escolha do kefkanita"]}, {"t": "p", "x": "O kefkanita deve escolher o efeito exato da Visão de Kefka antes de usar a zombaria. Todas as criaturas afetadas que falharem no teste de Constituição sofrem o mesmo efeito."}, {"t": "p", "x": "Se o kefkanita desejar alterar o efeito da Visão de Kefka, ele deve iniciar uma nova zombaria, e cada criatura afetada pode realizar um novo teste de resistência."}, {"t": "p", "x": "A Visão de Kefka é uma habilidade debilitante que afeta a mente."}]}, {"lv": 9, "n": "O Desprezo de Kefka", "blocks": [{"t": "p", "x": "Um kefkanita de 9º nível pode usar sua zombaria para desmoralizar inimigos. Os alvos devem estar a até 9 metros e ser capazes de ouvir o kefkanita."}, {"t": "p", "x": "Inimigos afetados sofrem uma penalidade de moral nas jogadas de ataque e nos testes de resistência igual ao modificador de Carisma do kefkanita."}, {"t": "p", "x": "Cada criatura inimiga dentro do alcance realiza um teste de Constituição para negar o efeito."}, {"t": "p", "x": "O desprezo de Kefka é um efeito de medo que afeta a mente."}]}, {"lv": 12, "n": "O Sorriso de Kefka", "blocks": [{"t": "p", "x": "Um kefkanita de 12º nível pode usar sua zombaria para causar desespero em um único inimigo a até 9 metros."}, {"t": "p", "x": "Sempre que o alvo dessa zombaria sofrer dano, ele deve realizar um teste de Constituição."}, {"t": "p", "x": "Cada teste de resistência falho aumenta o estado de medo do personagem em um passo:"}, {"t": "ul", "items": ["normal → abalado", "abalado → amedrontado", "amedrontado → em pânico"]}, {"t": "p", "x": "Em qualquer rodada em que o alvo não sofrer dano, ele pode realizar um teste de Constituição como ação padrão para reduzir sua condição em um passo de medo. Falhar nesse teste não aumenta o estado de medo."}, {"t": "p", "x": "Para cada três níveis que o kefkanita possuir além do 12º, ele pode afetar uma criatura adicional com essa habilidade."}, {"t": "p", "x": "O sorriso de Kefka é um efeito de medo que afeta a mente, e se acumula com outros efeitos de medo."}]}, {"lv": 15, "n": "O Ódio de Kefka", "blocks": [{"t": "p", "x": "Um kefkanita de 15º nível pode usar sua zombaria para gelar os ossos de seus inimigos. Os inimigos devem estar a até 9 metros e ser capazes de ouvir o kefkanita."}, {"t": "p", "x": "Inimigos afetados ficam acovardados de medo ao ouvir o ódio de Kefka."}, {"t": "p", "x": "Cada criatura dentro do alcance realiza um teste de Constituição para negar o efeito."}, {"t": "p", "x": "O ódio de Kefka é um efeito de medo que afeta a mente."}]}, {"lv": 18, "n": "A Gargalhada de Kefka", "blocks": [{"t": "p", "x": "No 18º nível, um kefkanita pode gastar cinco rodadas de sua zombaria cortante para levar uma criatura humanoide viva a até 9 metros à loucura."}, {"t": "p", "x": "O alvo realiza um teste de Constituiçãopara negar o efeito."}, {"t": "p", "x": "Se falhar, a criatura é afetada pela condição Confusão."}, {"t": "p", "x": "A duração desse efeito é permanente, mas o alvo pode realizar um novo teste de resistência diariamente para encerrar o efeito."}]}, {"lv": 20, "n": "O Servo de Kefka", "blocks": [{"t": "p", "x": "No 20º nível, um kefkanita pode gastar cinco rodadas de sua zombaria cortante para transformar uma criatura humanoide viva a até 9 metros em seu servo."}, {"t": "p", "x": "O alvo realiza um teste de Constituição para negar o efeito."}, {"t": "p", "x": "Se falhar, a criatura obedece a todas as ordens dadas pelo kefkanita."}, {"t": "p", "x": "A duração do efeito é permanente, mas o alvo pode realizar um novo teste de resistência diariamente para encerrar o efeito."}, {"t": "p", "x": "Um kefkanita não pode ter mais de um servo dessa forma ao mesmo tempo. Caso ele venha a dominar outra criatura, o servo anterior é imediatamente libertado desse efeito."}]}]}, {"id": "lunarianos", "name": "Lunarianos", "deity": "Althena", "deityInTitle": true, "intro": ["Os lunarianos veneram a deusa Althena. Em Sua Luz e Sabedoria, os lunarianos espalham seu amor, curando os enfermos e alimentando os pobres. O lunariano também é um mestre da revivificação no campo de batalha, sustentando e restaurando aliados para mantê-los lutando."], "facts": {"magias": {"head": "canções de bardo", "full": "Um lunariano executa canções de bardo, extraídas da lista de canções de bardo."}, "pericia": {"head": "Atuação (canto)", "full": "Um lunariano adiciona Atuação (canto) à sua lista de perícias de classe. Além disso, ela recebe um bônus em testes da perícia Conhecimento (Religião) igual à metade de seu nível (mínimo 1)."}, "arma": {"head": "espada longa", "full": "Um lunariano adiciona a espada longa à sua lista de proficiências com armas."}}, "castRules": ["Para aprender ou executar uma canção de bardo, o lunariano deve possuir Sabedoria igual ou superior a 10 + o nível da canção (Sab 11 para canções de 1º nível, Sab 12 para canções de 2º nível, e assim por diante). A Classe de Dificuldade para um teste de resistência contra uma canção de um lunariano é 8 + proficiencia + o modificador de Sabedoria dela.", "As canções são funcionalmente categorizadas em dois tipos: canções normais e canções mantidas. As canções normais se comportam em grande parte como magias, enquanto as canções mantidas exigem que o lunariano as mantenha (ação livre) a cada rodada para preservar seus efeitos. Um lunariano pode ter apenas uma canção mantida ativa por vez, sendo que as canções mantidas possuem características bastante diferentes das canções normais. Elas seguem as regras abaixo:", "O lunariano pode executar canções normais enquanto uma canção mantida estiver ativa. Qualquer canção normal que exija concentração para ser mantida ainda permite que o lunariano continue mantendo sua canção mantida, mas não permite que ele inicie uma nova canção até encerrar a canção atual.", "As criaturas devem permanecer dentro do alcance da canção para que o lunariano mantenha seus efeitos. Se uma criatura afetada por uma canção sair de seu alcance, o efeito persiste até o início do próximo turno dessa criatura.", "Se uma canção mantida tiver como alvo apenas um determinado número de criaturas, o lunariano pode trocar o(s) alvo(s) de sua canção mantida uma vez no início de seu turno (desde que estejam dentro do alcance da canção), encerrando imediatamente os efeitos da canção nos alvos anteriores.", "Qualquer canção mantida que imponha um teste de resistência a uma criatura o faz a cada rodada (enquanto estiver dentro do alcance) até que a criatura falhe no teste de resistência que aplica o efeito da canção; todas as rodadas subsequentes então mantêm esse efeito na criatura pela duração da canção ou até que seja dissipada.", "Se uma criatura for alvo de uma canção mantida e possuir resistência a magia, um teste de nível de conjurador é exigido do lunariano a cada rodada até que ele obtenha sucesso; a partir de então, todas as rodadas subsequentes não exigem novos testes de nível de conjurador para aquela canção.", "Iniciar uma nova canção provoca ataque de oportunidade e exige testes de concentração, como se fossem magias."], "domLede": "Um lunariano recebe acesso a dois dos seguintes domínios", "domains": ["comunidade", "bem", "cura", "conhecimento", "magia", "protecao"], "abLede": "Um lunariano recebe as seguintes habilidades de sua divindade conforme aumenta de nível.", "abilities": [{"lv": 1, "n": "Atuação de Bardo", "blocks": [{"t": "p", "x": "Um lunariano é treinado para usar a perícia Atuação (canto) para criar efeitos mágicos sobre aqueles ao seu redor, incluindo a si mesma, se desejar. Ela pode usar esta habilidade por um número de rodadas por dia igual a 4 + seu modificador de Carisma. A cada nível após o 1º, um lunariano pode usar a atuação de bardo por 2 rodadas adicionais por dia. A cada rodada, o lunariano pode produzir qualquer um dos tipos de atuação de bardo que tenha dominado, conforme indicado por seu nível."}, {"t": "p", "x": "Iniciar uma atuação de bardo é uma ação padrão, mas ela pode ser mantida a cada rodada como uma ação livre. Alterar uma atuação de bardo de um efeito para outro exige que o lunariano encerre a atuação anterior e inicie uma nova como uma ação padrão. Uma atuação de bardo não pode ser interrompida, mas termina imediatamente se o lunariano for morto, paralisado, atordoado, deixado inconsciente ou de qualquer outra forma impedido de realizar a ação livre necessária para mantê-la a cada rodada. Um lunariano não pode ter mais de uma atuação de bardo ativa ao mesmo tempo."}, {"t": "p", "x": "No 7º nível, um lunariano pode iniciar uma atuação de bardo como uma ação de movimento em vez de uma ação padrão. No 13º nível, um lunariano pode iniciar uma atuação de bardo como uma ação rápida."}, {"t": "p", "x": "Cada atuação de bardo possui componentes audíveis, componentes visuais, ou ambos."}, {"t": "p", "x": "Se uma atuação de bardo possuir componentes audíveis, os alvos devem ser capazes de ouvir o lunariano para que a atuação tenha qualquer efeito, e tais atuações dependem de linguagem. Um lunariano surdo tem 20% de chance de falhar ao tentar usar uma atuação de bardo com componente audível. Se falhar nesse teste, a tentativa ainda conta para o limite diário. Criaturas surdas são imunes a atuações de bardo com componentes audíveis."}, {"t": "p", "x": "Se uma atuação de bardo possuir um componente visual, os alvos devem ter linha de visão do lunariano para que a atuação tenha qualquer efeito. Um lunariano cego tem 50% de chance de falhar ao tentar usar uma atuação de bardo com componente visual. Se falhar nesse teste, a tentativa ainda conta para o limite diário. Criaturas cegas são imunes a atuações de bardo com componentes visuais."}]}, {"lv": 1, "n": "Inspirar Coragem", "blocks": [{"t": "p", "x": "Uma lunariana de 1º nível pode usar sua atuação para inspirar coragem em seus aliados (incluindo a si mesma), fortalecendo-os contra o medo e aprimorando suas capacidades de combate. Para ser afetado, um aliado deve ser capaz de perceber a atuação da lunariana. Um aliado afetado recebe um bônus de moral +1 em testes de resistência contra efeitos de encanto e medo, além de um bônus de competência +1 nas jogadas de ataque e dano com armas. No 5º nível, e a cada seis níveis de clérigo subsequentes, esse bônus aumenta em +1, até um máximo de +4 no 17º nível. Inspirar coragem é uma habilidade afetadora da mente. Inspirar coragem pode usar componentes audíveis ou visuais; a lunariana deve escolher qual componente utilizar ao iniciar sua atuação."}]}, {"lv": 3, "n": "Inspirar Competência", "blocks": [{"t": "p", "x": "Uma lunariana de 3º nível ou superior pode usar sua atuação para ajudar um aliado a ter sucesso em uma tarefa. O aliado deve estar a até 9 metros e ser capaz de ver e ouvir a lunariana. O aliado recebe um bônus de competência +2 em testes de perícia com uma perícia específica enquanto continuar ouvindo a atuação da lunariana. Esse bônus aumenta em +1 para cada quatro níveis que a lunariana alcançar além do 3º (+3 no 7º, +4 no 11º, +5 no 15º e +6 no 19º)."}, {"t": "p", "x": "Certos usos dessa habilidade são inviáveis, como Furtividade, e podem ser proibidos a critério do Mestre. Uma lunariana não pode inspirar competência em si mesma. Inspirar competência depende de componentes audíveis."}]}, {"lv": 6, "n": "Canção de Althena", "blocks": [{"t": "p", "x": "Uma lunariana de 6º nível ou superior pode gastar um número de rodadas de sua atuação para criar um efeito equivalente a uma magia de cura em um aliado, usando o nível da lunariana como nível de conjurador. Com uma rodada de sua atuação, a lunariana pode criar o efeito da magia cura. Com três rodadas, pode criar o efeito da magia cura II. Com cinco rodadas, pode criar o efeito da magia cura III. O alvo deve ser capaz de ver e ouvir a lunariana. A Canção de Althena depende de componentes audíveis e visuais."}]}, {"lv": 9, "n": "Inspirar Grandeza", "blocks": [{"t": "p", "x": "Uma lunariana de 9º nível ou superior pode usar sua atuação para inspirar grandeza em si mesma ou em um único aliado voluntário a até 9metros, concedendo maior capacidade de combate. Para cada três níveis que a lunariana alcançar além do 9º, ela pode afetar um aliado adicional ao usar sua atuação (até um máximo de quatro no 18º nível). Para inspirar grandeza, todos os alvos devem ser capazes de ver e ouvir a lunariana. Uma criatura inspirada com grandeza recebe 2 Dados de Vida bônus (d10), a quantidade correspondente de pontos de vida temporários (aplique o modificador de Constituição do alvo, se houver, a esses Dados de Vida bônus), um bônus de competência +2 nas jogadas de ataque e um bônus de competência +1 em testes de Constituição. Os Dados de Vida bônus contam como Dados de Vida normais para determinar os efeitos de magias que dependem de Dados de Vida. Inspirar grandeza é uma habilidade afetadora da mente e depende de componentes audíveis e visuais."}]}, {"lv": 12, "n": "Atuação Calmante", "blocks": [{"t": "p", "x": "Uma lunariana de 12º nível ou superior pode gastar cinco rodadas de sua atuação para criar um efeito equivalente à magia cura total (cura), usando o nível da lunariana como nível de conjurador. Além disso, sua atuação remove as condições fatigado, enjoado e abalado de todos os afetados. Os alvos devem ser capazes de ver e ouvir a lunariana. A atuação calmante depende de componentes audíveis e visuais."}]}, {"lv": 15, "n": "Inspirar Heroísmo", "blocks": [{"t": "p", "x": "Uma lunariana de 15º nível ou superior pode inspirar um heroísmo extraordinário em si mesma ou em um único aliado a até 9metros. Para cada três níveis de clérigo que a personagem alcançar além do 15º, ela pode inspirar heroísmo em uma criatura adicional. Para inspirar heroísmo, todos os alvos devem ser capazes de ver e ouvir a lunariana. As criaturas inspiradas recebem um bônus de moral +4 em testes de resistência e um bônus de esquiva +4 na CA. O efeito dura enquanto os alvos forem capazes de testemunhar a atuação. Inspirar heroísmo é uma habilidade afetadora da mente que depende de componentes audíveis e visuais."}]}, {"lv": 18, "n": "Balada Fúnebre", "blocks": [{"t": "p", "x": "Uma lunariana de 18º nível ou superior pode gastar cinco rodadas de sua atuação para criar um efeito equivalente à magia erguer em uma criatura morta, usando o nível da lunariana como nível de conjurador. O alvo deve estar a até 3 metros da lunariana. A balada fúnebre depende de componentes audíveis e visuais."}]}, {"lv": 20, "n": "Amor de Althena", "blocks": [{"t": "p", "x": "No 20º nível, uma lunariana pode gastar cinco rodadas de sua atuação para conceder Cura Rápida 10 a todos os aliados dentro de 9 metros Criaturas malignas que ouvirem a atuação e falharem em um teste de Constituição (CD 15 + o modificador de Carisma dela) ficam cegas e surdas pela duração do efeito. Em caso de sucesso no teste, ficam abaladas. Mortos-vivos ou criaturas com o subtipo maligno que falharem em seus testes ficam atordoadas pela duração, enquanto aquelas que obtiverem sucesso ficam cambaleantes."}, {"t": "p", "x": "A lunariana deve gastar uma rodada de sua atuação para manter a duração do efeito. A cada rodada em que esta atuação estiver ativa, criaturas malignas que tenham falhado no teste de resistência inicial podem realizar um novo teste de resistência a cada rodada subsequente. O Amor de Althena depende de componentes audíveis e visuais."}]}]}, {"id": "pastor-do-vazio", "name": "Pastor do Vazio", "deity": "Promathia", "deityInTitle": false, "intro": ["Aprender a verdade tem um preço. Um contingente de estudiosos em busca da antiga cidade de Tu’Lia fez uma descoberta avassaladora e adentrou O Vazio. Lá, vislumbraram a verdade de sua própria imperfeição e buscaram corrigi-la. Esses Pastores do Vazio agora trabalham para trazer a ressurreição de Promathia, o Guardião do Apocalipse, e sua destruição subsequente. Quando isso for concluído, todas as almas serão arrancadas desses corpos imperfeitos, correndo em direção ao moribundo Promathia em uma reunião perfeita."], "facts": {"magias": {"head": "magias de mago negro", "full": "Um pastor do vazio conjura magias de mago negro, retiradas da lista de magias do Mago Negro."}, "pericia": {"head": "Percepção", "full": "Um pastor do vazio adiciona Percepção à sua lista de perícias de classe.\nAlém disso, ele recebe um bônus em testes de Conhecimento (Planos) igual à metade do seu nível de clérigo."}, "arma": {"head": "correntes com espinhos", "full": "Um pastor do vazio adiciona correntes com espinhos à sua lista de proficiências com armas."}}, "castRules": ["Para aprender ou conjurar uma magia de mago negro, o pastor do vazio deve possuir um valor de Sabedoria igual a pelo menos 10 + o nível da magia (Sab 11 para magias de 1º nível, Sab 12 para magias de 2º nível, e assim por diante).", "A Classe de Dificuldade (CD) para um teste de resistência contra uma magia do pastor do vazio é 8 + proficiência + o modificador de Sabedoria dele.\nTodas as magias de mago negro aprendidas pelo pastor do vazio utilizam Sabedoria no lugar de Inteligência para todos os efeitos das magias."], "domLede": "Um pastor do vazio ganha acesso a dois dos seguintes domínios", "domains": ["morte", "destruicao", "mal", "lei", "vazio"], "abLede": "Um pastor do vazio ganha as seguintes habilidades de sua divindade conforme aumenta de nível.", "abilities": [{"lv": 1, "n": "Conhecimento Verdadeiro", "blocks": [{"t": "p", "x": "No 1º nível, se o valor de Inteligência do pastor do vazio for inferior a 13, ele é considerado 13 apenas para fins de cumprir pré-requisitos de talentos."}]}, {"lv": 3, "n": "Bênção Malevolente", "blocks": [{"t": "p", "x": "No 3º nível, o pastor do vazio aumenta em +1 a CD de todas as magias da escola das trevas que conjura."}]}, {"lv": 6, "n": "Maestria com Correntes", "blocks": [{"t": "p", "x": "No 6º nível, o pastor do vazio torna-se mais hábil no manuseio de sua corrente com espinhos, símbolo das amarras de Promathia."}, {"t": "p", "x": "Ele recebe o talento Maestria com Correntes como talento bônus, sem precisar cumprir seus pré-requisitos."}, {"t": "p", "x": "Além disso, ao realizar manobras de combate de desarmar ou derrubar usando sua corrente com espinhos, o pastor do vazio pode usar seu nível de clérigo no lugar de seu bonus de ataque para calcular sua manobra."}]}, {"lv": 9, "n": "Ventos do Oblívio", "blocks": [{"t": "p", "x": "No 9º nível, o pastor do vazio invoca o Vazio, puxando as almas de seus inimigos na tentativa de enviá-las a Promathia."}, {"t": "p", "x": "Ele pode tentar Amaldiçoar todos os inimigos em um raio de 9 metros por um número de rodadas igual ao seu modificador de Carisma."}, {"t": "p", "x": "Um teste de Constituição bem-sucedido nega o efeito."}, {"t": "p", "x": "O pastor do vazio pode usar essa habilidade um número de vezes por dia igual a 3 + seu modificador de Carisma."}]}, {"lv": 12, "n": "Corrente Dilacerante", "blocks": [{"t": "p", "x": "No 12º nível, quando o pastor do vazio realiza com sucesso uma manobra de combate de desarmar ou derrubar um inimigo com sua corrente com espinhos, esse inimigo provoca um ataque de oportunidade contra ele."}, {"t": "p", "x": "Além disso, o pastor do vazio recebe um bônus de +2 em ataques de oportunidade realizados contra oponentes que ele tenha desarmado ou derrubado com a corrente com espinhos na rodada anterior."}]}, {"lv": 15, "n": "Libertação Infernal", "blocks": [{"t": "p", "x": "No 15º nível, o pastor do vazio pode gastar 3 usos diários de canalizar energia para criar uma fenda momentânea para o Vazio a até 30 metros de distância, da qual uma sombra irrompe em uma explosão com raio de 9 metros."}, {"t": "p", "x": "Criaturas atingidas sofrem 15d8 pontos de dano de sombra e ficam atordoadas por 1 rodada."}, {"t": "p", "x": "Um teste de Constituição bem-sucedido reduz o dano à metade e nega a condição."}]}, {"lv": 18, "n": "Não Importa", "blocks": [{"t": "p", "x": "No 18º nível, o pastor do vazio compreende que tudo nesta vida é uma mentira, e que a verdadeira existência começa quando todas as almas se unem a Promathia."}, {"t": "p", "x": "No início de seu turno, sem gastar ação, o pastor do vazio pode gastar 1 uso diário de canalizar energia para ignorar os efeitos de uma condição negativa da qual esteja sofrendo por 1 rodada."}, {"t": "p", "x": "Nas rodadas seguintes, ele pode continuar gastando um uso diário de canalizar energia para ignorar essa mesma condição por mais uma rodada."}, {"t": "p", "x": "Apenas uma condição pode ser ignorada por rodada com essa habilidade."}]}, {"lv": 20, "n": "Reunião das Almas", "blocks": [{"t": "p", "x": "No 20º nível, o pastor do vazio pode usar uma pequena porção do poder de Promathia, dilacerando a alma de um inimigo e trazendo-a para dentro de seu próprio corpo."}, {"t": "p", "x": "Uma vez por dia, quando o pastor do vazio morre, ele pode usar essa habilidade como reação contra seu assassino. Ele pode fazê-lo mesmo estando inconsciente, tendo como alvo a última criatura que o causou dano caso morra sangrando."}, {"t": "p", "x": "A criatura alvo deve realizar um teste de Constituição ou morrer instantaneamente. Este é um efeito de morte."}, {"t": "p", "x": "Se a criatura alvo morrer devido a esse efeito, o pastor do vazio é restaurado à vida com todos os pontos de vida."}]}]}, {"id": "protetor", "name": "Protetor", "deity": "Alexander", "deityInTitle": false, "intro": ["Discípulos do Protetor do Reino, Alexander, são dedicados a s se dissipam no início do turno desse aliado. Sempre que o protetor gastar um uso de sua habilidade de classe Canalizar energia, o alcance desta habilidade aumenta para 9 metros até o início do próximo turno dela e ela conjura Esunaga centrado em si mesma."}]}]}]};

const ORD = DATA.orders;
const DOM = DATA.domains;
const domById = Object.fromEntries(DOM.map((d) => [d.id, d]));
const ordById = Object.fromEntries(ORD.map((o) => [o.id, o]));
const giversOf = (id) => ORD.filter((o) => o.domains.includes(id));
const DOM_SORTED = [...DOM].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));

const state = { reg: 'ordens', view: 'index', order: null, domain: null, from: null, q: '' };
const $ = (s) => document.querySelector(s);
const narrow = () => window.matchMedia('(max-width: 749px)').matches;
const norm = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function inline(text) {
  return text.split('\n').map((line) => {
    const m = line.match(/^([^:.]{1,28}):\s(.+)$/);
    return m ? `<b class="lbl">${esc(m[1])}:</b> ${esc(m[2])}` : esc(line);
  }).join('<br>');
}

function renderBlocks(blocks) {
  let html = '', grid = [];
  const flushGrid = () => {
    if (!grid.length) return;
    html += `<div class="elist">${grid.map((b) => `<section><h6>${esc(b.title)}</h6><ul>${
      b.rows.map(([c, n]) => `<li><span>${esc(c)}</span><span>${esc(n)}</span></li>`).join('')}</ul></section>`).join('')}</div>`;
    grid = [];
  };
  for (const b of blocks) {
    if (b.t === 'spells') { grid.push(b); continue; }
    flushGrid();
    if (b.t === 'p') html += `<p>${inline(b.x)}</p>`;
    else if (b.t === 'h') html += `<h5>${esc(b.x)}</h5>`;
    else if (b.t === 'ul') html += `<ul>${b.items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>`;
    else if (b.t === 'table') html += `<div class="tbl"><table>${b.title ? `<caption>${esc(b.title)}</caption>` : ''}<thead><tr>${
      b.head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${
      b.rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  flushGrid();
  return html;
}

const seal = (lv) => lv
  ? `<div class="seal" aria-label="${lv}º nível"><b>${lv}º</b><small>nível</small></div>`
  : `<div class="seal none" aria-label="desde que o domínio é ganho"><b>—</b></div>`;

/* ── índice ─────────────────────────────── */
function hl(text, q) {
  if (!q) return esc(text);
  const i = norm(text).indexOf(q);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}

function orderArt(o, cls) {
  const img = o.image ? `<img src="${esc(o.image)}" alt="">` : '';
  return `<span class="${cls}" aria-hidden="true">${img}</span>`;
}

function orderItem(o, q) {
  const cur = state.view !== 'index' && state.order === o.id && (state.view === 'order' || state.from === o.id);
  return `<button type="button" class="ix-item ix-order" data-order="${o.id}" ${cur ? 'aria-current="true"' : ''}>
    ${orderArt(o, 'ix-art')}
    <span class="ix-name">${hl(o.name, q)}</span>
    ${o.deity ? `<span class="ix-deity">de ${hl(o.deity, q)}</span>` : ''}
    <span class="ix-line">${o.domains.map((id) => hl(domById[id].name, q)).join(' · ')}</span>
  </button>`;
}

function domainHint(d, q) {
  if (!q || norm(d.name).includes(q)) return null;
  const p = d.powers.find((x) => norm(x.n).includes(q));
  if (p) return `poder: ${hl(p.n, q)}`;
  const s = d.spells.find((x) => norm(x.n).includes(q));
  if (s) return `${s.c}º círculo: ${hl(s.n, q)}`;
  return null;
}

function domainItem(d, q) {
  const g = giversOf(d.id);
  const cur = state.view === 'domain' && state.domain === d.id;
  const hint = domainHint(d, q);
  const line = hint || (g.length ? g.map((o) => esc(o.name)).join(' · ') : 'nenhuma ordem catalogada');
  return `<button type="button" class="ix-item ix-dom" data-domain="${d.id}" ${cur ? 'aria-current="true"' : ''}>
    <span class="ix-name">${hl(d.name, q)}</span>
    <span class="ix-line">${line}</span>
  </button>`;
}

function matchOrder(o, q) {
  return [o.name, o.deity || '', ...o.domains.map((id) => domById[id].name)].some((s) => norm(s).includes(q));
}
function matchDomain(d, q) {
  return [d.name, ...d.powers.map((p) => p.n), ...d.spells.map((s) => s.n)].some((s) => norm(s).includes(q));
}

function renderIndex() {
  const q = norm(state.q.trim());
  document.querySelectorAll('[data-reg]').forEach((b) => b.setAttribute('aria-pressed', String(!q && b.dataset.reg === state.reg)));
  let html = '';
  if (q) {
    const os = ORD.filter((o) => matchOrder(o, q));
    const ds = DOM_SORTED.filter((d) => matchDomain(d, q));
    if (os.length) html += `<div class="ix-group"><b>Ordens</b><i></i><small>${os.length}</small></div>` + os.map((o) => orderItem(o, q)).join('');
    if (ds.length) html += `<div class="ix-group"><b>Domínios</b><i></i><small>${ds.length}</small></div>` + ds.map((d) => domainItem(d, q)).join('');
    if (!os.length && !ds.length) html = `<p class="ix-empty">Nada com “${esc(state.q.trim())}” entre ordens, deuses, domínios, poderes ou magias.</p>`;
  } else if (state.reg === 'ordens') {
    html = ORD.map((o) => orderItem(o, '')).join('') +
      `<p class="ix-foot" style="margin-top:14px">${ORD.length} ordens deíficas do Clérigo.</p>`;
  } else {
    let letter = '';
    for (const d of DOM_SORTED) {
      const L = norm(d.name)[0].toUpperCase();
      if (L !== letter) {
        letter = L;
        const n = DOM_SORTED.filter((x) => norm(x.name)[0].toUpperCase() === L).length;
        html += `<div class="ix-group"><b>${L}</b><i></i><small>${n}</small></div>`;
      }
      html += domainItem(d, '');
    }
  }
  $('#ix').innerHTML = html;
}

/* ── folha da ordem ─────────────────────── */
function renderOrder(o) {
  const f = o.facts;
  const rules = o.castRules.length
    ? (o.castRules.length > 2
      ? `<details class="rubric"><summary>Regras de conjuração (${o.castRules.length} parágrafos)</summary><div>${o.castRules.map((p) => `<p>${inline(p)}</p>`).join('')}</div></details>`
      : `<div class="rubric">${o.castRules.map((p) => `<p>${inline(p)}</p>`).join('')}</div>`)
    : '';
  return `<article class="leaf">
    <button type="button" class="back m-only" data-go="index">← Ordens</button>
    <header class="head">
      <figure class="plate">${o.image ? `<img src="${esc(o.image)}" alt="Imagem de ${esc(o.name)}">` : ''}</figure>
      <span class="kicker">Ordem deífica do Clérigo</span>
      <h2 class="gt" id="leafH" tabindex="-1">${esc(o.name)}</h2>
      ${o.deity ? `<span class="deity">devotos de <b>${esc(o.deity)}</b></span>` : ''}
      <div class="filete" aria-hidden="true"><span>◆</span></div>
    </header>

    <div class="prose drop">${o.intro.map((p) => `<p>${esc(p)}</p>`).join('')}</div>

    <dl class="facts">
      <div class="fact"><dt>Magias</dt><dd class="fh">${esc(f.magias.head)}</dd><dd class="ff">${esc(f.magias.full)}</dd></div>
      <div class="fact"><dt>Perícia de classe</dt><dd class="fh">${esc(f.pericia.head)}</dd><dd class="ff">${esc(f.pericia.full)}</dd></div>
      <div class="fact"><dt>Arma favorita</dt><dd class="fh">${esc(f.arma.head)}</dd><dd class="ff">${esc(f.arma.full)}</dd></div>
    </dl>
    ${rules}

    <section class="sect">
      <h3>Domínios</h3>
      <p class="lede">${esc(o.domLede)}:</p>
      <div class="doms">${o.domains.map((id) => `<button type="button" data-domain="${id}" data-from="${o.id}">${esc(domById[id].name)}</button>`).join('')}</div>
      <p class="note8"><b>8º</b> Domínio extra desta mesma lista: nele, nível, SAB e CAR contam 3 pontos abaixo, e a habilidade de nível mais alto chega três níveis depois.</p>
    </section>

    <section class="sect">
      <h3>Habilidades da Divindade</h3>
      <p class="lede">${esc(o.abLede)}</p>
      <ol class="ladder">${o.abilities.map((a) => `<li class="step">${seal(a.lv)}<div class="step-body"><h4>${esc(a.n)}</h4>${renderBlocks(a.blocks)}</div></li>`).join('')}</ol>
    </section>
  </article>`;
}

/* ── folha do domínio ───────────────────── */
function renderDomain(d) {
  const from = state.from ? ordById[state.from] : null;
  const g = giversOf(d.id);
  return `<article class="leaf">
    <button type="button" class="back${from ? '' : ' m-only'}" data-go="${from ? 'order' : 'index'}">← ${from ? esc(from.name) : 'Domínios'}</button>
    <header class="head">
      <span class="kicker">Domínio${from ? ' · oferecido por ' + esc(from.name) : ''}</span>
      <h2 class="gt" id="leafH" tabindex="-1">${esc(d.name)}</h2>
      <div class="filete" aria-hidden="true"><span>◆</span></div>
    </header>

    <div class="prose drop"><p>${esc(d.flavor)}</p></div>

    <section class="sect">
      <h3>Poderes Concedidos</h3>
      <ol class="ladder">${d.powers.map((p) => `<li class="step">${seal(p.lv)}<div class="step-body"><h4>${esc(p.n)}</h4>${
        p.x.split('\n').map((t) => `<p>${esc(t)}</p>`).join('')}</div></li>`).join('')}</ol>
    </section>

    <section class="sect">
      <h3>Magias do Domínio</h3>
      <ol class="spl">${d.spells.map((s) => {
        const m = s.n.match(/^(.*?)\s*\((.+)\)$/);
        const name = m ? `${esc(m[1])}<small>(${esc(m[2])})</small>` : esc(s.n);
        return `<li><span class="c" aria-label="${s.c}º círculo">${s.c}º</span><span class="n">${name}</span></li>`;
      }).join('')}</ol>
    </section>

    <section class="sect">
      <h3>Ordens que concedem</h3>
      ${g.length
        ? `<div class="givers">${g.map((o) => `<button type="button" data-order="${o.id}" ${from && from.id === o.id ? 'aria-current="true"' : ''}><b>${esc(o.name)}</b>${o.deity ? `<small>de ${esc(o.deity)}</small>` : ''}</button>`).join('')}</div>`
        : `<p class="none-text">Nenhuma das ${ORD.length} ordens catalogadas oferece este domínio.</p>`}
    </section>
  </article>`;
}

function renderCover() {
  return `<article class="leaf cover">
    <span class="kicker">Clérigo · Domínios</span>
    <h2 class="gt" id="leafH" tabindex="-1" style="font:700 clamp(2rem,4vw,3rem)/1.1 var(--f-display);letter-spacing:.05em">Códice das Ordens</h2>
    <div class="filete" aria-hidden="true"><span>◆</span></div>
    <p>No 1º nível o clérigo serve a uma ordem deífica, que concede habilidades por nível e uma lista de domínios. Escolha uma ordem ou um domínio no índice.</p>
    <div class="counts"><div><b>${ORD.length}</b><small>ordens</small></div><div><b>${DOM.length}</b><small>domínios</small></div></div>
  </article>`;
}

function renderFolio(focus) {
  const f = $('#folio');
  if (state.view === 'order') f.innerHTML = renderOrder(ordById[state.order]);
  else if (state.view === 'domain') f.innerHTML = renderDomain(domById[state.domain]);
  else f.innerHTML = renderCover();
  if (focus) {
    const h = $('#leafH');
    if (h) h.focus({ preventScroll: true });
    if (narrow()) window.scrollTo(0, 0);
    else if (f.getBoundingClientRect().top < 0) f.scrollIntoView({ block: 'start' });
  }
}

function go(view, patch = {}) {
  Object.assign(state, patch, { view });
  $('#codex').dataset.view = view;
  renderIndex();
  renderFolio(view !== 'index' || !narrow());
}

function back() {
  if (state.view === 'domain' && state.from) go('order', { order: state.from, domain: null, from: null });
  else if (state.view === 'domain') go('index', { reg: 'dominios', domain: null });
  else if (state.view === 'order') go('index', { reg: 'ordens', order: null });
}

/* ── eventos ────────────────────────────── */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.themeOpt) return setTheme(t.dataset.themeOpt);
  if (t.dataset.reg) {
    state.q = ''; $('#q').value = '';
    state.reg = t.dataset.reg;
    return renderIndex();
  }
  if (t.dataset.order) return go('order', { order: t.dataset.order, domain: null, from: null });
  if (t.dataset.domain) return go('domain', { domain: t.dataset.domain, from: t.dataset.from || null, order: t.dataset.from || state.order });
  if (t.dataset.go) return back();
});

$('#q').addEventListener('input', (e) => { state.q = e.target.value; renderIndex(); });

document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== $('#q')) {
    e.preventDefault();
    if (narrow() && state.view !== 'index') go('index');
    $('#q').focus();
    return;
  }
  if (e.key !== 'Escape') return;
  if (document.activeElement === $('#q') && state.q) { state.q = ''; $('#q').value = ''; renderIndex(); return; }
  back();
});

/* ── tema ───────────────────────────────── */
function setTheme(opt) {
  const root = document.documentElement;
  try {
    if (opt === 'system') { root.removeAttribute('data-theme'); localStorage.removeItem('ifdb-theme'); }
    else { root.setAttribute('data-theme', opt); localStorage.setItem('ifdb-theme', opt); }
  } catch (err) {
    if (opt === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', opt);
  }
  syncTheme();
}
function syncTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'system';
  document.querySelectorAll('[data-theme-opt]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeOpt === cur)));
}

$('#nOrd').textContent = ORD.length;
$('#nDom').textContent = DOM.length;
syncTheme();
if (narrow()) go('index');
else go('order', { order: ORD[0].id });
</script>
</body>
</html>
